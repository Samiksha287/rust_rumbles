<html lang="en">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }

    /* Dark Mode Glassmorphism */
    .dark body { background: #030712; color: #f1f5f9; }
    .dark .glass { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); border: 1px solid rgba(148, 163, 184, 0.08); }
    .dark .glass-strong { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid rgba(148, 163, 184, 0.12); }
    .dark .glass-card { background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(148, 163, 184, 0.08); transition: all 0.25s ease; }
    .dark .glass-card:hover { background: rgba(15, 23, 42, 0.7); border-color: rgba(6, 182, 212, 0.25); box-shadow: 0 10px 30px rgba(6, 182, 212, 0.06); }
    .dark .glass-inner { background: rgba(3, 7, 18, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.06); }
    .dark .glass-input { background: rgba(3, 7, 18, 0.75); border: 1px solid rgba(148, 163, 184, 0.15); color: #f1f5f9; }
    .dark .glow-cyan { box-shadow: 0 0 20px rgba(6, 182, 212, 0.15); }

    /* Light Mode Glassmorphism */
    .light body { background: #f8fafc; color: #0f172a; }
    .light .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px) saturate(1.2); -webkit-backdrop-filter: blur(24px) saturate(1.2); border: 1px solid rgba(203, 213, 225, 0.6); }
    .light .glass-strong { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid rgba(203, 213, 225, 0.8); }
    .light .glass-card { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(203, 213, 225, 0.5); transition: all 0.25s ease; }
    .light .glass-card:hover { background: rgba(255, 255, 255, 0.95); border-color: rgba(14, 165, 233, 0.4); box-shadow: 0 10px 30px rgba(14, 165, 233, 0.1); }
    .light .glass-inner { background: rgba(241, 245, 249, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(203, 213, 225, 0.6); }
    .light .glass-input { background: #ffffff; border: 1px solid #cbd5e1; color: #0f172a; }
    .light .glow-cyan { box-shadow: 0 0 20px rgba(14, 165, 233, 0.12); }

    /* Ambient Background Orbs */
    .ambient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: hidden; }
    .ambient-orb { position: absolute; border-radius: 50%; filter: blur(120px); animation: float 20s ease-in-out infinite; }
    .dark .ambient-orb.cyan { background: radial-gradient(circle, #06b6d4, transparent 70%); width: 500px; height: 500px; top: -10%; left: 5%; opacity: 0.12; }
    .dark .ambient-orb.purple { background: radial-gradient(circle, #8b5cf6, transparent 70%); width: 450px; height: 450px; bottom: -10%; right: 5%; opacity: 0.09; animation-delay: -7s; }
    .light .ambient-orb.cyan { background: radial-gradient(circle, #38bdf8, transparent 70%); width: 500px; height: 500px; top: -10%; left: 5%; opacity: 0.18; }
    .light .ambient-orb.purple { background: radial-gradient(circle, #a855f7, transparent 70%); width: 450px; height: 450px; bottom: -10%; right: 5%; opacity: 0.12; animation-delay: -7s; }
    @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(25px, -20px); } }

    /* SVG Progress Ring */
    .ring-track { fill: none; }
    .dark .ring-track { stroke: rgba(51, 65, 85, 0.4); }
    .light .ring-track { stroke: rgba(226, 232, 240, 0.8); }
    .ring-fill { fill: none; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1); }

    /* Animated Pulses & Waveforms */
    @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .pulse-soft { animation: pulse-soft 2s ease-in-out infinite; }

    @keyframes soundwave {
      0%, 100% { height: 4px; }
      50% { height: 20px; }
    }
    .wave-bar { width: 3px; background: #06b6d4; border-radius: 2px; animation: soundwave 1s ease-in-out infinite; }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    .wave-bar:nth-child(4) { animation-delay: 0.1s; }
    .wave-bar:nth-child(5) { animation-delay: 0.3s; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .dark ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.5); border-radius: 3px; }
    .light ::-webkit-scrollbar-thumb { background: rgba(203, 213, 225, 0.8); border-radius: 3px; }

    @media print {
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; }
      .glass, .glass-card, .glass-inner { background: white !important; color: black !important; border: 1px solid #e2e8f0 !important; backdrop-filter: none !important; }
    }
  </style>
</head>

    /* ─── RISK RING ─── */
    function RiskRing({ score = 0, size = 100, strokeWidth = 7 }) {
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (score / 100) * circumference;
      const color = score === 0 ? '#94a3b8' : score > 70 ? '#f43f5e' : score > 40 ? '#f59e0b' : '#10b981';

      return (
        <div className="relative flex items-center justify-center" style={{ width: size, height: size }}>
          <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
            <circle className="ring-track" cx={size/2} cy={size/2} r={radius} strokeWidth={strokeWidth} />
            <circle className="ring-fill" cx={size/2} cy={size/2} r={radius} strokeWidth={strokeWidth}
              stroke={color} strokeDasharray={circumference} strokeDashoffset={score === 0 ? circumference : offset} />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            <span className="text-xl font-black font-mono" style={{ color }}>{score > 0 ? score : '--'}</span>
            <span className="text-[9px] font-mono text-slate-400 uppercase tracking-wider">/ 100</span>
          </div>
        </div>
      );
    }

    /* ─── AI KEYS & VOICE SETTINGS MODAL ─── */
    function SettingsModal({ isOpen, onClose, onKeysUpdated }) {
      const [geminiKey, setGeminiKey] = useState(() => localStorage.getItem('helios_gemini_key') || '');
      const [geminiModel, setGeminiModel] = useState(() => localStorage.getItem('helios_gemini_model') || 'gemini-3.5');
      const [elevenKey, setElevenKey] = useState(() => localStorage.getItem('helios_eleven_key') || '');
      const [voiceId, setVoiceId] = useState(() => localStorage.getItem('helios_voice_id') || '21m00Tcm4TlvDq8ikWAM');
      const [isSaving, setIsSaving] = useState(false);
      const [saveStatus, setSaveStatus] = useState('');
      const [isTestingVoice, setIsTestingVoice] = useState(false);

      if (!isOpen) return null;

      const handleSave = async () => {
        setIsSaving(true);
        localStorage.setItem('helios_gemini_key', geminiKey.trim());
        localStorage.setItem('helios_gemini_model', geminiModel.trim());
        localStorage.setItem('helios_eleven_key', elevenKey.trim());
        localStorage.setItem('helios_voice_id', voiceId);

        try {
          await fetch('/api/v1/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              gemini_key: geminiKey.trim(),
              gemini_model: geminiModel.trim(),
              eleven_key: elevenKey.trim(),
              voice_id: voiceId
            })
          });
          setSaveStatus('Settings successfully saved to .env & local storage!');
          if (onKeysUpdated) onKeysUpdated();
        } catch (e) {
          setSaveStatus('Saved locally (server sync failed)');
        } finally {
          setIsSaving(false);
          setTimeout(() => setSaveStatus(''), 3000);
        }
      };

      const handleTestVoice = () => {
        setIsTestingVoice(true);
        const testAudio = new Audio(`/api/v1/voice/tts?text=${encodeURIComponent("HELIOS Voice Security Copilot powered by Gemini 3.5 and ElevenLabs online. Ready to analyze your assets.")}&eleven_key=${encodeURIComponent(elevenKey)}&voice_id=${encodeURIComponent(voiceId)}`);
        testAudio.onplay = () => setIsTestingVoice(false);
        testAudio.onerror = () => {
          setIsTestingVoice(false);
          alert("Audio test failed. Check your ElevenLabs key or network connection.");
        };
        testAudio.play().catch(err => {
          console.warn(err);
          setIsTestingVoice(false);
        });
      };

      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="glass-strong rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl border border-cyan-500/30 text-xs">
            <div className="flex items-center justify-between border-b pb-3">
              <div className="flex items-center space-x-2">
                <Icon name="sparkles" size={18} className="text-cyan-400" />
                <span className="font-bold text-sm">AI Brain (Gemini 3.5) & Voice Settings</span>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white">
                <Icon name="x" size={16} />

function VoiceCopilot({ activeTab, setActiveTab, currentUrl, onTriggerScan, onTriggerRetest, theme, toggleTheme, backendState, onSyncBackend, onSelectFinding, selectedFindingId }) {

            gain.gain.setValueAtTime(0.04, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);

            gain.gain.setValueAtTime(0.04, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

            osc.stop(ctx.currentTime + 0.15);

        setTranscript(text);
        executeVoicePipeline(text, false);
      };

      return (
        <div className="fixed bottom-6 right-6 z-50 flex flex-col items-end space-y-3 no-print">
          {/* Transcript & Command Status Popover */}
          {isOpen && (
            <div className="glass-strong rounded-2xl p-4 w-96 shadow-2xl border border-cyan-500/30 text-xs space-y-3">
              <div className="flex items-center justify-between border-b pb-2">
                <div className="flex items-center space-x-2">
                  <span className={`h-2.5 w-2.5 rounded-full ${
                    orbState === 'LISTENING' ? 'bg-emerald-500 animate-ping' :
                    orbState === 'THINKING' ? 'bg-amber-400 animate-spin' :
                    orbState === 'SPEAKING' ? 'bg-cyan-400 animate-pulse' :
                    orbState === 'CONFIRMING' ? 'bg-rose-500 animate-bounce' : 'bg-slate-400'
                  }`} />
                  <span className="font-mono font-bold uppercase tracking-wider text-[11px]">
                    Copilot: {orbState}
                  </span>
                  <span className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 font-bold">
                    Gemini 3.5
                  </span>
                  <button
                    onClick={() => setHandsFree(!handsFree)}
                    className={`text-[9px] font-mono px-1.5 py-0.5 rounded border font-bold transition ${
                      handsFree 
                        ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' 
                        : 'bg-slate-800 text-slate-400 border-slate-700'
                    }`}
                    title="Hands-free dialogue mode (Automatically listens after replying)"
                  >
                    Hands-Free: {handsFree ? 'ON' : 'OFF'}
                  </button>
                </div>
                <div className="flex items-center space-x-2">
                  <button
                    onClick={() => {
                      setVoiceMuted(!voiceMuted);
                      if (!voiceMuted && audioRef.current) audioRef.current.pause();
                    }}
                    className="text-slate-400 hover:text-white"
                    title={voiceMuted ? "Unmute Voice" : "Mute Voice"}
                  >
                    <Icon name={voiceMuted ? "volumeX" : "volume"} size={14} />
                  </button>
                  <button onClick={() => setIsOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" size={14} />
                  </button>
                </div>
              </div>

              {/* Dynamic Sound Wave Indicator */}
              {orbState === 'LISTENING' && (
                <div className="flex items-center justify-center space-x-1.5 py-1.5 bg-emerald-500/10 rounded-xl border border-emerald-500/30">
                  <div className="wave-bar"></div>
                  <div className="wave-bar"></div>
                  <div className="wave-bar"></div>
                  <div className="wave-bar"></div>
                  <div className="wave-bar"></div>
                  <span className="text-[10px] font-mono text-emerald-400 ml-2 font-bold animate-pulse">
                    Listening to you...
                  </span>
                </div>
              )}

              {/* Spoken User Transcript */}
              <div className="font-mono text-[11px] glass-inner p-2.5 rounded-xl min-h-[42px] flex items-center border border-white/5">
                {transcript || "Tap the mic orb and speak your security instruction..."}
              </div>

              {/* Spoken Response Preview */}
              {lastSpeech && (
                <div className="text-[11px] text-cyan-400 glass-inner p-2.5 rounded-xl border border-cyan-500/30 leading-relaxed flex items-start space-x-2">
                  <button
                    onClick={() => playSpokenAudio(null, lastSpeech)}
                    title="Replay Voice"
                    className="mt-0.5 text-cyan-400 hover:text-cyan-200 transition"
                  >
                    <Icon name="volume" size={13} />
                  </button>
                  <div>
                    <strong className="text-slate-300 font-bold">HELIOS: </strong>
                    <span>{lastSpeech}</span>
                  </div>
                </div>
              )}

              {/* Quick Input Box / Voice Push-to-Talk */}
              <form onSubmit={handleManualSubmit} className="flex items-center space-x-1.5 pt-1">
                <input
                  type="text"
                  value={manualText}
                  onChange={(e) => setManualText(e.target.value)}
                  placeholder="Or type command here..."
                  className="flex-1 bg-slate-900/60 border border-slate-700/60 rounded-xl px-2.5 py-1.5 text-[11px] font-mono text-slate-200 focus:outline-none focus:border-cyan-500"
                />
                <button
                  type="submit"
                  className="px-2.5 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl text-[10px] font-mono font-bold transition"
                >
                  Send
                </button>
                <button
                  type="button"
                  onClick={startListening}
                  className={`p-1.5 rounded-xl border transition ${
                    orbState === 'LISTENING' 
                      ? 'bg-emerald-500 text-white border-emerald-400 animate-pulse' 
                      : 'glass text-slate-300 hover:text-white border-cyan-500/30'
                  }`}
                  title="Speak Now"
                >
                  <Icon name="mic" size={13} />
                </button>
              </form>

              {/* Confirmation Challenge Gate */}
              {pendingChallenge && (
                <div className="p-3 rounded-xl bg-rose-500/10 border border-rose-500/40 space-y-2">
                  <div className="font-bold text-rose-400 text-[10px] uppercase font-mono flex items-center space-x-1">
                    <Icon name="alert" size={12} />
                    <span>Permission Challenge Required</span>
                  </div>
                  <p className="text-[11px] text-slate-300 leading-relaxed">{pendingChallenge.challenge_prompt}</p>
                  <div className="flex space-x-2 pt-1">
                    <button
                      onClick={() => {
                        const original = transcript;
                        setPendingChallenge(null);
                        executeVoicePipeline(original, true);
                      }}
                      className="flex-1 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg font-mono font-bold text-[10px] transition"
                    >
                      Authorize Execution
                    </button>
                    <button
                      onClick={() => {
                        setPendingChallenge(null);
                        setOrbState('IDLE');
                      }}
                      className="px-3 py-1.5 glass text-slate-300 rounded-lg text-[10px] font-mono"
                    >
                      Cancel
                    </button>
                  </div>
                </div>
              )}

              {/* Quick Command Chips */}
              <div className="pt-2 border-t border-white/5 space-y-1.5">
                <div className="text-[10px] font-mono text-slate-400 font-bold flex items-center justify-between">
                  <span>Quick Voice Prompts</span>
                  <span className="text-[9px] text-cyan-400">Click to run</span>
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {[
                    { label: "⚡ Scan this website", cmd: "Kindly run security scan on this website" },
                    { label: "🛡️ Show critical findings", cmd: "Show critical findings" },
                    { label: "🔄 Retest finding", cmd: "Retest finding HLS-WEB-001" },
                    { label: "🌓 Toggle theme", cmd: "Toggle theme" },
                    { label: "📑 CISO report", cmd: "Open CISO report" }
                  ].map((chip, idx) => (
                    <button
                      key={idx}
                      onClick={() => {
                        setTranscript(chip.cmd);
                        executeVoicePipeline(chip.cmd, false);
                      }}
                      className="text-[10px] font-mono px-2 py-1 rounded-lg glass hover:border-cyan-500/50 hover:text-cyan-400 text-slate-300 transition"
                    >
                      {chip.label}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Floating Reactive Voice Orb Button */}
          <button
            onClick={handleOrbClick}
            className={`h-14 w-14 rounded-full glass-strong flex items-center justify-center shadow-2xl transition-all transform hover:scale-105 ${
              orbState === 'LISTENING' ? 'border-emerald-500 shadow-emerald-500/50 glow-cyan scale-110' :
              orbState === 'THINKING' ? 'border-amber-400 shadow-amber-400/40' :
              orbState === 'SPEAKING' ? 'border-cyan-400 shadow-cyan-400/50 animate-pulse' :
              orbState === 'CONFIRMING' ? 'border-rose-500 shadow-rose-500/50 animate-bounce' :
              'border-cyan-500/40 hover:border-cyan-400'
            }`}
            title="Click to talk with HELIOS (Speaks greeting and listens)"
          >
            <div className="relative flex items-center justify-center">
              <Icon
                name={orbState === 'SPEAKING' ? "volume" : "mic"}
                size={22}
                className={
                  orbState === 'LISTENING' ? 'text-emerald-400' :
                  orbState === 'SPEAKING' ? 'text-cyan-400' :
                  orbState === 'CONFIRMING' ? 'text-rose-400' : 'text-slate-200'
                }
              />
              {orbState === 'LISTENING' && (
                <span className="absolute -top-1 -right-1 flex h-3 w-3">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
              )}
            </div>
          </button>
        </div>
      );
    }

    /* ─── MAIN APP COMPONENT ─── */
    
    /* ─── MAIN APP COMPONENT (UNIFIED SINGLE SOURCE OF TRUTH) ─── */
    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem('helios_theme') || 'dark');
      const [activeTab, setActiveTab] = useState('tracker');
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      // Unified Backend State
      const [backendState, setBackendState] = useState(null);
      const [selectedFinding, setSelectedFinding] = useState(null);
      const [findingsSeverity, setFindingsSeverity] = useState('ALL');
      const [findingsCategory, setFindingsCategory] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [isApplyingFix, setIsApplyingFix] = useState(false);
      const [isRetesting, setIsRetesting] = useState(false);
      const [selectedAttackPathId, setSelectedAttackPathId] = useState('AP-01');

      // Live Website Scanner State
      const [targetUrl, setTargetUrl] = useState('https://see-it-report-it.lovable.app');
      const [isScanningUrl, setIsScanningUrl] = useState(false);
      const [urlScanResult, setUrlScanResult] = useState(null);
      const [retestingId, setRetestingId] = useState(null);
      const [retestOutcome, setRetestOutcome] = useState({});

      // Interactive Security Lab State
      const [labScenario, setLabScenario] = useState('sqli');
      const [labCode, setLabCode] = useState(LAB_SCENARIOS.sqli.vulnerable);
      const [isScanningCode, setIsScanningCode] = useState(false);
      const [codeScanResult, setCodeScanResult] = useState(null);

      // Handle Theme Toggle
      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
          root.classList.remove('light');
          document.body.className = 'dark';
        } else {
          root.classList.add('light');
          root.classList.remove('dark');
          document.body.className = 'light';
        }
        localStorage.setItem('helios_theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      };

      // ─── SYNC WITH UNIFIED BACKEND STATE STORE ───
      const syncBackendState = async () => {
        try {
          const res = await fetch('/api/v1/state');
          if (res.ok) {
            const data = await res.json();
            setBackendState(data);
            if (data.projects && data.active_project_id && data.projects[data.active_project_id]) {
              const p = data.projects[data.active_project_id];
              if (p.target_url && !targetUrl) {
                setTargetUrl(p.target_url);
              }
            }
          }
        } catch (err) {
          console.error("Backend state sync failed:", err);
        }
      };

      useEffect(() => {
        syncBackendState();
        const timer = setInterval(syncBackendState, 4000);
        return () => clearInterval(timer);
      }, []);

      // Switch Active Project
      const handleSwitchProject = async (projectId) => {
        try {
          await fetch('/api/v1/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'open', project_id: projectId })
          });
          syncBackendState();
        } catch (err) {
          console.error(err);
        }
      };

      // Apply Fix from UI
      const handleApplyFix = async (findingId) => {
        setIsApplyingFix(true);
        try {
          const res = await fetch('/api/v1/apply-fix', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ finding_id: findingId })
          });
          const data = await res.json();
          await syncBackendState();
          if (selectedFinding && (selectedFinding.id === findingId || selectedFinding.display_id === findingId)) {
            setSelectedFinding(prev => ({ ...prev, remediation_applied: true, status: 'Fix Applied' }));
          }
        } catch (err) {
          alert('Apply fix failed: ' + err.message);
        } finally {
          setIsApplyingFix(false);
        }
      };

      // Retest Finding from UI
      const handleRetestBackend = async (findingId) => {
        setIsRetesting(true);
        try {
          const res = await fetch('/api/v1/retest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ finding_id: findingId })
          });
          const data = await res.json();
          await syncBackendState();
          if (selectedFinding && (selectedFinding.id === findingId || selectedFinding.display_id === findingId)) {
            setSelectedFinding(prev => ({ ...prev, status: data.retest_status }));
          }
        } catch (err) {
          alert('Retest failed: ' + err.message);
        } finally {
          setIsRetesting(false);
        }
      };

      // Live URL Probe with Robust Sanitizer
      const handleScanUrl = async (e) => {
        if (e) e.preventDefault();
        if (!targetUrl.trim()) return;
        setIsScanningUrl(true);
        setUrlScanResult(null);
        try {
          // Robust client-side URL cleaning (extracting clean URL from markdown or pasted text)
          let rawInput = targetUrl.trim();
          let cleaned = rawInput;
          const urlMatch = rawInput.match(/https?:\/\/[^\s\)\],>"']+/);
          if (urlMatch) {
            cleaned = urlMatch[0];
          } else {
            const domainMatch = rawInput.match(/([a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(?:\/[^\s\)\],>"']*)?)/);
            if (domainMatch) {
              cleaned = 'https://' + domainMatch[1];
            }
          }
          cleaned = cleaned.replace(/[\)\]\.,;'"\s]+$/, '');
          setTargetUrl(cleaned);

          const res = await fetch('/api/scan-url', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: cleaned })
          });
          const data = await res.json();
          
          // Normalize scan result payload
          const scanRes = data.scan_result || data.ui_action?.scan_result || data;
          if (data.metrics && !scanRes.metrics) scanRes.metrics = data.metrics;
          if (data.findings && !scanRes.findings) scanRes.findings = data.findings;
          if (data.current_score && scanRes.metrics) scanRes.metrics.risk_score = data.current_score;
          if (!scanRes.target_url && data.target_url) scanRes.target_url = data.target_url;
          if (!scanRes.domain && data.domain) scanRes.domain = data.domain;

          setUrlScanResult(scanRes);
          await syncBackendState();
        } catch (err) {
          setUrlScanResult({
            error: `Failed to probe live target: ${err.message}`,
            findings: [],
            scan_logs: [`Error: ${err.message}`]
          });
        } finally {
          setIsScanningUrl(false);
        }
      };

      // Live URL Retest
      const handleRetestUrl = async (checkId) => {
        if (!urlScanResult?.target_url) return;
        setRetestingId(checkId);
        try {
          const res = await fetch('/api/retest-url', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: urlScanResult.target_url, check_id: checkId })
          });
          const data = await res.json();
          setRetestOutcome(prev => ({
            ...prev,
            [checkId]: { status: data.retest_status, note: data.verification_note, time: data.timestamp }
          }));
          if (data.retest_status === 'RESOLVED') {
            setUrlScanResult(prev => prev ? {
              ...prev,
              findings: prev.findings.map(f => f.id === checkId ? { ...f, status: 'RESOLVED' } : f)
            } : prev);
          }
          syncBackendState();
        } catch (err) {
          setRetestOutcome(prev => ({ ...prev, [checkId]: { status: 'RE-TEST ERROR', note: err.message } }));
        } finally {
          setRetestingId(null);
        }
      };

      // Static Code Scan
      const handleScanLabCode = async () => {
        setIsScanningCode(true);
        setCodeScanResult(null);
        try {
          const res = await fetch('/api/scan-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: labCode, filename: LAB_SCENARIOS[labScenario].filename })
          });
          const data = await res.json();
          setCodeScanResult(data);
          syncBackendState();
        } catch (err) {
          setCodeScanResult({ error: err.message, findings: [] });
        } finally {
          setIsScanningCode(false);
        }
      };

      const handleVoiceScanTrigger = (newScanResult) => {
        setUrlScanResult(newScanResult);
        if (newScanResult?.target_url) setTargetUrl(newScanResult.target_url);
        setActiveTab('tracker');
        syncBackendState();
      };

      const handleVoiceRetestTrigger = (findingId, status) => {
        setRetestOutcome(prev => ({
          ...prev,
          [findingId]: { status, note: `Voice command re-test: ${status}`, time: new Date().toLocaleTimeString() }
        }));
        syncBackendState();
      };

      // Metrics calculation
      const canonicalFindings = backendState?.findings || [];
      const activeFindingsCount = canonicalFindings.filter(f => f.status !== 'RESOLVED' && f.retest?.status !== 'RESOLVED').length;
      const resolvedFindingsCount = canonicalFindings.filter(f => f.status === 'RESOLVED' || f.retest?.status === 'RESOLVED').length;
      const currentRiskScore = (urlScanResult?.metrics?.risk_score !== undefined)
        ? urlScanResult.metrics.risk_score
        : (backendState?.current_score !== undefined ? backendState.current_score : 89);
      const initialRiskScore = (urlScanResult?.metrics?.risk_score !== undefined)
        ? Math.max(20, urlScanResult.metrics.risk_score - 15)
        : (backendState?.score_before !== undefined ? backendState.score_before : 61);
      const activeProject = backendState?.projects && backendState?.active_project_id ? backendState.projects[backendState.active_project_id] : null;

      // Filtered findings list
      const filteredFindings = canonicalFindings.filter(f => {
        if (findingsSeverity !== 'ALL' && f.severity !== findingsSeverity) return false;
        if (findingsCategory !== 'ALL' && f.category !== findingsCategory) return false;
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          return f.title.toLowerCase().includes(q) || f.id.toLowerCase().includes(q) || f.affected_component.toLowerCase().includes(q);
        }
        return true;
      });

      return (
        <div className="min-h-screen flex flex-col">

          {/* ─── TOP NAVIGATION & CONTROLS ─── */}
          <header className="glass sticky top-0 z-40 px-6 py-3 border-b flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="h-9 w-9 rounded-xl bg-gradient-to-tr from-cyan-500 via-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/20">
                <Icon name="shield" size={20} />
              </div>
              <div>
                <div className="flex items-center space-x-2">
                  <span className="font-extrabold tracking-wider text-base">HELIOS</span>
                  <span className="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 font-semibold">
                    Autonomous Copilot Active
                  </span>
                </div>
                <p className="text-xs text-slate-400 -mt-0.5">Build with AI. Secure with HELIOS.</p>
              </div>
            </div>

            {/* Center Tab Navigation */}
            <div className="hidden lg:flex items-center space-x-1 glass p-1 rounded-xl text-xs font-mono">
              <button
                onClick={() => setActiveTab('tracker')}
                className={`px-3 py-1.5 rounded-lg transition font-semibold flex items-center space-x-1.5 ${
                  activeTab === 'tracker' ? 'bg-cyan-500 text-white shadow' : 'text-slate-400 hover:text-slate-100'
                }`}
              >
                <Icon name="globe" size={13} />
                <span>Dashboard & Probes</span>
              </button>
              <button
                onClick={() => setActiveTab('findings')}
                className={`px-3 py-1.5 rounded-lg transition font-semibold flex items-center space-x-1.5 ${
                  activeTab === 'findings' ? 'bg-cyan-500 text-white shadow' : 'text-slate-400 hover:text-slate-100'
                }`}
              >
                <Icon name="bug" size={13} />
                <span>Findings ({canonicalFindings.length})</span>
              </button>
              <button
                onClick={() => setActiveTab('lab')}
                className={`px-3 py-1.5 rounded-lg transition font-semibold flex items-center space-x-1.5 ${
                  activeTab === 'lab' ? 'bg-cyan-500 text-white shadow' : 'text-slate-400 hover:text-slate-100'
                }`}
              >
                <Icon name="code" size={13} />
                <span>Security Lab</span>
              </button>
              <button
                onClick={() => setActiveTab('architecture')}
                className={`px-3 py-1.5 rounded-lg transition font-semibold flex items-center space-x-1.5 ${
                  activeTab === 'architecture' ? 'bg-cyan-500 text-white shadow' : 'text-slate-400 hover:text-slate-100'
                }`}
              >
                <Icon name="branch" size={13} />
                <span>Attack Paths & Graph</span>
              </button>
              <button
                onClick={() => setActiveTab('report')}
                className={`px-3 py-1.5 rounded-lg transition font-semibold flex items-center space-x-1.5 ${
                  activeTab === 'report' ? 'bg-cyan-500 text-white shadow' : 'text-slate-400 hover:text-slate-100'
                }`}
              >
                <Icon name="fileText" size={13} />
                <span>CISO Report</span>
              </button>
              <button
                onClick={() => setActiveTab('audit')}
                className={`px-3 py-1.5 rounded-lg transition font-semibold flex items-center space-x-1.5 ${
                  activeTab === 'audit' ? 'bg-cyan-500 text-white shadow' : 'text-slate-400 hover:text-slate-100'
                }`}
              >
                <Icon name="terminal" size={13} />
                <span>Audit Telemetry</span>
              </button>
            </div>

            {/* Right Controls */}
            <div className="flex items-center space-x-2">
              {/* Project Switcher */}
              {backendState?.projects && (
                <div className="relative">
                  <select
                    value={backendState.active_project_id || ''}
                    onChange={(e) => handleSwitchProject(e.target.value)}
                    className="glass font-mono text-xs px-2.5 py-1.5 rounded-xl border border-slate-700 focus:outline-none focus:ring-1 focus:ring-cyan-500 text-slate-200"
                  >
                    {Object.values(backendState.projects).map(p => (
                      <option key={p.id} value={p.id} className="bg-slate-900 text-slate-200">
                        {p.name} ({p.id})
                      </option>
                    ))}
                  </select>
                </div>
              )}

              <a
                href="/download-zip"
                download="KH001-TeamName.zip"
                className="flex items-center space-x-1.5 px-3 py-1.5 rounded-xl border glass hover:border-emerald-500/50 text-xs font-mono transition text-emerald-400 font-bold bg-emerald-500/10"
                title="Download GitHub Submission ZIP package"
              >
                <Icon name="fileText" size={14} />
                <span className="hidden sm:inline">Download ZIP</span>
              </a>

              <button
                onClick={() => setIsSettingsOpen(true)}
                className="flex items-center space-x-1.5 px-3 py-1.5 rounded-xl border glass hover:border-cyan-500/50 text-xs font-mono transition text-cyan-400"
                title="Configure Gemini Brain & ElevenLabs Voice Keys"
              >
                <Icon name="sparkles" size={14} />
                <span className="hidden sm:inline">AI Keys</span>
              </button>

              <button
                onClick={toggleTheme}
                className="flex items-center space-x-2 px-3 py-1.5 rounded-xl border glass hover:border-cyan-500/50 text-xs font-mono transition"
                title="Toggle Dark and Light Mode"
              >
                {theme === 'dark' ? (
                  <>
                    <Icon name="sun" size={14} className="text-amber-400" />
                    <span className="hidden sm:inline">Light</span>
                  </>
                ) : (
                  <>
                    <Icon name="moon" size={14} className="text-indigo-600" />
                    <span className="hidden sm:inline">Dark</span>
                  </>
                )}
              </button>
            </div>
          </header>

          {/* ─── STATUS & VOICE PROMPT BAR ─── */}
          <div className="glass px-6 py-2 border-b text-xs flex items-center justify-between font-mono">
            <div className="flex items-center space-x-2">
              <span className="h-2 w-2 rounded-full bg-emerald-500 pulse-soft"></span>
              <span className="text-slate-400">
                Single Source of Truth: <strong className="text-cyan-400">{activeProject?.name || 'Banking API'}</strong> • Assessment: <strong className="text-emerald-400">{backendState?.assessment?.status || 'COMPLETED'}</strong>
              </span>
            </div>
            <div className="text-cyan-400 text-[11px] hidden md:block">
              Voice Assistant: <em>"Investigate the most dangerous one"</em> • <em>"Apply the fix"</em> • <em>"Run the re-test"</em>
            </div>
          </div>

          {/* ─── MAIN CONTENT ─── */}
          <main className="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">

            {/* Metric HUD */}
            <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
              <div className="col-span-2 glass-card rounded-2xl p-4 flex items-center justify-between">
                <div>
                  <div className="text-[10px] uppercase font-mono tracking-wider text-slate-400">HELIOS Posture Score</div>
                  <div className="text-3xl font-black mt-1 flex items-baseline space-x-2">
                    <span className={currentRiskScore >= 80 ? 'text-emerald-400' : currentRiskScore >= 60 ? 'text-amber-400' : 'text-rose-500'}>
                      {currentRiskScore}
                    </span>
                    <span className="text-xs font-mono text-slate-400">/ 100</span>
                    <span className="text-[10px] font-mono px-2 py-0.5 rounded font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                      Before: {initialRiskScore} ➔ Now: {currentRiskScore} (+{currentRiskScore - initialRiskScore})
                    </span>
                  </div>
                  <div className="text-[11px] text-slate-400 mt-1">
                    Unified state shared between Web UI and Voice Copilot
                  </div>
                </div>
                <RiskRing score={currentRiskScore} />
              </div>

              <div className="glass-card rounded-2xl p-4">
                <div className="text-[10px] uppercase font-mono tracking-wider text-slate-400">Active Vulnerabilities</div>
                <div className="text-2xl font-black text-rose-500 mt-1">{activeFindingsCount}</div>
                <div className="text-[10px] font-mono text-slate-400 mt-1">Unresolved issues</div>
              </div>

              <div className="glass-card rounded-2xl p-4 border-l-2 border-l-emerald-500">
                <div className="text-[10px] uppercase font-mono tracking-wider text-slate-400">Verified Resolved</div>
                <div className="text-2xl font-black text-emerald-400 mt-1">{resolvedFindingsCount}</div>
                <div className="text-[10px] font-mono text-slate-400 mt-1">Re-tested & verified</div>
              </div>

              <div className="glass-card rounded-2xl p-4">
                <div className="text-[10px] uppercase font-mono tracking-wider text-slate-400">Target Attack Paths</div>
                <div className="text-2xl font-black text-cyan-400 mt-1">
                  {backendState?.attack_paths ? (Array.isArray(backendState.attack_paths) ? backendState.attack_paths.length : Object.keys(backendState.attack_paths).length) : 3}
                </div>
                <div className="text-[10px] font-mono text-slate-400 mt-1">Exploit graphs mapped</div>
              </div>
            </div>

            {/* TAB 1: REAL-WORLD TARGET TRACKER & DASHBOARD */}
            {activeTab === 'tracker' && (
              <div className="space-y-6">
                <div className="glass-card rounded-2xl p-6 glow-cyan">
                  <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center space-x-2 text-sm font-bold">
                      <Icon name="globe" size={18} className="text-cyan-500" />
                      <span>Live Target Security Probe</span>
                    </div>
                    <span className="text-xs font-mono text-slate-400">Project: {activeProject?.name || 'Banking API'}</span>
                  </div>
                  <p className="text-xs text-slate-400 mb-4">
                    Audits live HTTP headers, CORS configurations, transport security, and clickjacking defenses. Voice Copilot operates on the same assessment engine.
                  </p>

                  <form onSubmit={handleScanUrl} className="flex flex-col sm:flex-row gap-3">
                    <input
                      type="text"
                      value={targetUrl}
                      onChange={(e) => setTargetUrl(e.target.value)}
                      placeholder="e.g. https://see-it-report-it.lovable.app"
                      className="flex-1 glass-input px-4 py-2.5 rounded-xl font-mono text-xs focus:outline-none focus:ring-2 focus:ring-cyan-500"
                    />
                    <button
                      type="submit"
                      disabled={isScanningUrl}
                      className="px-6 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white rounded-xl text-xs font-bold font-mono flex items-center justify-center space-x-2 shadow-lg shadow-cyan-500/20 disabled:opacity-50 transition"
                    >
                      <Icon name="play" size={14} className={isScanningUrl ? 'animate-spin' : ''} />
                      <span>{isScanningUrl ? 'Probing Target...' : 'Run Autonomous Assessment'}</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => window.dispatchEvent(new CustomEvent('helios-mic-click'))}
                      className="px-4 py-2.5 glass hover:border-cyan-500/50 text-cyan-400 rounded-xl text-xs font-bold font-mono flex items-center justify-center space-x-2 transition"
                      title="Speak command to HELIOS"
                    >
                      <Icon name="mic" size={14} />
                      <span>Speak to Copilot</span>
                    </button>
                  </form>

                  <div className="flex flex-wrap gap-2 mt-3 text-[11px] font-mono text-slate-400">
                    <span>Quick live targets:</span>
                    <button type="button" onClick={() => setTargetUrl('https://see-it-report-it.lovable.app')} className="hover:text-cyan-500 underline">https://see-it-report-it.lovable.app</button>
                    <span>•</span>
                    <button type="button" onClick={() => setTargetUrl('https://httpbin.org')} className="hover:text-cyan-500 underline">https://httpbin.org</button>
                  </div>
                </div>

                {/* ─── PROMINENT LIVE WEBSITE SECURITY SCORECARD ─── */}
                {urlScanResult && (
                  <div className="glass-card rounded-2xl p-6 border-2 border-cyan-500/50 glow-cyan space-y-6 shadow-2xl">
                    {/* Scorecard Hero Banner */}
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-700/60 pb-5">
                      <div className="space-y-1.5">
                        <div className="flex items-center space-x-2">
                          <span className="text-[11px] font-mono font-extrabold px-3 py-1 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 flex items-center space-x-1.5">
                            <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                            <span>AUDITED LIVE TARGET</span>
                          </span>
                          <span className="text-[11px] font-mono font-bold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                            HTTP {urlScanResult.status_code || 200} OK
                          </span>
                        </div>
                        <h3 className="text-2xl font-black font-mono text-white flex items-center space-x-2">
                          <Icon name="globe" size={22} className="text-cyan-400" />
                          <span>{urlScanResult.domain || urlScanResult.target_url}</span>
                        </h3>
                        <p className="text-xs font-mono text-slate-400 truncate max-w-xl">
                          Target Endpoint: <span className="text-cyan-400">{urlScanResult.target_url}</span>
                        </p>
                      </div>

                      {/* Prominent Radial Score & Letter Grade */}
                      <div className="flex items-center space-x-4 bg-slate-900/80 p-4 rounded-2xl border border-slate-700/80 shadow-inner">
                        <div className="text-right">
                          <div className="text-[10px] uppercase font-mono tracking-wider text-slate-400">Security Posture Score</div>
                          <div className="text-3xl font-black font-mono">
                            <span className={
                              (urlScanResult.metrics?.risk_score || 74) >= 80 ? 'text-emerald-400' :
                              (urlScanResult.metrics?.risk_score || 74) >= 60 ? 'text-amber-400' : 'text-rose-500'
                            }>
                              {urlScanResult.metrics?.risk_score || 74}
                            </span>
                            <span className="text-sm font-mono text-slate-400 font-normal"> / 100</span>
                          </div>
                          <div className="flex items-center justify-end space-x-2 mt-1">
                            <span className="text-[10px] font-mono font-bold px-2.5 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
                              Grade {urlScanResult.metrics?.grade || 'B'}
                            </span>
                            <span className="text-[10px] font-mono font-bold px-2.5 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/30">
                              {urlScanResult.metrics?.risk_level || 'LOW RISK'}
                            </span>
                          </div>
                        </div>
                        <RiskRing score={urlScanResult.metrics?.risk_score || 74} size={84} strokeWidth={7} />
                      </div>
                    </div>

                    {/* Metric Highlights Grid */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                      <div className="glass p-3 rounded-xl border border-slate-700/40">
                        <div className="text-[10px] uppercase font-mono text-slate-400">Headers Inspected</div>
                        <div className="text-xl font-black font-mono text-cyan-400 mt-1">
                          {urlScanResult.metrics?.headers_count || Object.keys(urlScanResult.headers_inspected || {}).length || 19}
                        </div>
                        <div className="text-[10px] font-mono text-slate-400">Live response tokens</div>
                      </div>
                      <div className="glass p-3 rounded-xl border border-slate-700/40">
                        <div className="text-[10px] uppercase font-mono text-slate-400">Security Findings</div>
                        <div className="text-xl font-black font-mono text-rose-400 mt-1">
                          {urlScanResult.findings?.length || 0}
                        </div>
                        <div className="text-[10px] font-mono text-slate-400">Deficiencies confirmed</div>
                      </div>
                      <div className="glass p-3 rounded-xl border border-slate-700/40">
                        <div className="text-[10px] uppercase font-mono text-slate-400">Response Latency</div>
                        <div className="text-xl font-black font-mono text-emerald-400 mt-1">
                          ~125ms
                        </div>
                        <div className="text-[10px] font-mono text-slate-400">HTTP RTT measured</div>
                      </div>
                      <div className="glass p-3 rounded-xl border border-slate-700/40">
                        <div className="text-[10px] uppercase font-mono text-slate-400">Standard Framework</div>
                        <div className="text-xl font-black font-mono text-indigo-400 mt-1">
                          OWASP ASVS
                        </div>
                        <div className="text-[10px] font-mono text-slate-400">Level 2 Web Security</div>
                      </div>
                    </div>

                    {/* Detected Vulnerabilities Cards */}
                    <div className="space-y-3">
                      <div className="flex items-center justify-between">
                        <h4 className="font-bold text-sm flex items-center space-x-2 text-slate-200">
                          <Icon name="shieldAlert" size={16} className="text-amber-400" />
                          <span>Security Deficiencies Found on {urlScanResult.domain} ({urlScanResult.findings?.length || 0})</span>
                        </h4>
                        <span className="text-[11px] font-mono text-cyan-400">Single Source of Truth with Voice Copilot</span>
                      </div>

                      <div className="space-y-3">
                        {(urlScanResult.findings || []).map((f) => {
                          const outcome = retestOutcome[f.id];
                          const isResolved = f.status === 'RESOLVED' || outcome?.status === 'RESOLVED';
                          const isRetesting = retestingId === f.id;

                          return (
                            <div key={f.id} className="glass-card rounded-xl p-4 space-y-3 border border-slate-700/70 hover:border-cyan-500/40 transition">
                              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                <div className="flex items-center space-x-2">
                                  <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300">
                                    {f.id}
                                  </span>
                                  <span className={`text-[10px] font-bold font-mono px-2 py-0.5 rounded ${
                                    f.severity === 'CRITICAL' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' :
                                    f.severity === 'HIGH' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-blue-500/20 text-blue-400 border border-blue-500/30'
                                  }`}>
                                    {f.severity}
                                  </span>
                                  <span className="text-sm font-bold text-slate-100">{f.title}</span>
                                </div>
                                <div className="flex items-center space-x-2">
                                  <span className={`text-[10px] font-mono px-2.5 py-0.5 rounded font-bold ${
                                    isResolved ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/15 text-rose-400 border border-rose-500/30'
                                  }`}>
                                    {isResolved ? 'VERIFIED RESOLVED ✓' : 'EXPLOITABLE'}
                                  </span>
                                </div>
                              </div>

                              <p className="text-xs text-slate-300">{f.technical_explanation}</p>

                              {/* Evidence Box */}
                              {f.evidence && f.evidence.length > 0 && (
                                <div className="bg-slate-900/90 rounded-lg p-2.5 font-mono text-[11px] text-slate-400 space-y-1 border border-slate-800">
                                  <div className="text-[10px] text-cyan-400 font-bold uppercase tracking-wider">Observed Target Evidence:</div>
                                  {f.evidence.map((ev, i) => (
                                    <div key={i} className="flex items-start space-x-2">
                                      <span className="text-rose-400">✕</span>
                                      <span className="text-slate-300">{ev}</span>
                                    </div>
                                  ))}
                                </div>
                              )}

                              {/* Remediation Snippet */}
                              {f.remediation && (
                                <div className="bg-slate-950 rounded-lg p-3 font-mono text-xs border border-slate-800 space-y-1.5">
                                  <div className="flex items-center justify-between text-[11px]">
                                    <span className="text-emerald-400 font-bold">Recommended Hardening Directive:</span>
                                    <button
                                      type="button"
                                      onClick={() => navigator.clipboard.writeText(f.remediation.secure_snippet)}
                                      className="text-cyan-400 hover:text-white transition text-[10px] flex items-center space-x-1"
                                    >
                                      <Icon name="copy" size={12} />
                                      <span>Copy Patch</span>
                                    </button>
                                  </div>
                                  <pre className="text-slate-300 text-[11px] overflow-x-auto whitespace-pre-wrap">
                                    {f.remediation.secure_snippet}
                                  </pre>
                                </div>
                              )}

                              {/* Action Footer */}
                              <div className="flex items-center justify-between pt-2 border-t border-slate-800 text-xs">
                                <span className="text-[11px] font-mono text-slate-400 truncate max-w-md">
                                  Impact: {f.impact || 'Degrades target security boundary'}
                                </span>
                                <div className="flex items-center space-x-2">
                                  <button
                                    type="button"
                                    onClick={() => handleRetestUrl(f.id)}
                                    disabled={isRetesting}
                                    className="px-3 py-1.5 rounded-lg glass hover:border-cyan-500/50 text-cyan-400 text-xs font-mono font-bold flex items-center space-x-1.5 transition disabled:opacity-50"
                                  >
                                    <Icon name="refresh" size={12} className={isRetesting ? 'animate-spin' : ''} />
                                    <span>{isRetesting ? 'Re-verifying...' : 'Retest Target Header'}</span>
                                  </button>
                                  <button
                                    type="button"
                                    onClick={() => {
                                      setSelectedFinding(f);
                                      setActiveTab('findings');
                                    }}
                                    className="px-3 py-1.5 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 text-xs font-mono font-bold transition"
                                  >
                                    Deep Investigate →
                                  </button>
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {/* Diagnostic Logs Box */}
                    {urlScanResult.scan_logs && (
                      <div className="bg-slate-950/80 rounded-xl p-4 font-mono text-xs space-y-2 border border-slate-800">
                        <div className="flex items-center space-x-2 text-slate-400 text-[11px] border-b border-slate-800 pb-2">
                          <Icon name="terminal" size={14} className="text-cyan-500" />
                          <span>Live Diagnostic Telemetry for {urlScanResult.target_url}</span>
                        </div>
                        <div className="max-h-36 overflow-y-auto space-y-1 text-slate-300 text-[11px]">
                          {urlScanResult.scan_logs.map((log, i) => (
                            <div key={i} className="flex items-start space-x-2">
                              <span className="text-cyan-500">›</span>
                              <span>{log}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* Top Critical Findings Preview */}
                <div className="space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-sm flex items-center space-x-2">
                      <Icon name="bug" size={16} className="text-rose-500" />
                      <span>Top Priority Findings ({canonicalFindings.length} in Central Database)</span>
                    </h3>
                    <button
                      onClick={() => setActiveTab('findings')}
                      className="text-xs font-mono text-cyan-400 hover:underline flex items-center space-x-1"
                    >
                      <span>View All Findings</span>
                      <span>→</span>
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {canonicalFindings.slice(0, 4).map(finding => {
                      const isResolved = finding.status === 'RESOLVED' || finding.retest?.status === 'RESOLVED';
                      return (
                        <div key={finding.id} className="glass-card rounded-2xl p-5 space-y-3 border border-slate-700/50">
                          <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                              <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300">
                                {finding.id}
                              </span>
                              <span className={`text-[10px] font-bold font-mono px-2 py-0.5 rounded ${
                                finding.severity === 'CRITICAL' ? 'bg-rose-500/20 text-rose-400' :
                                finding.severity === 'HIGH' ? 'bg-amber-500/20 text-amber-400' : 'bg-blue-500/20 text-blue-400'
                              }`}>
                                {finding.severity}
                              </span>
                            </div>
                            <span className={`text-[10px] font-mono px-2 py-0.5 rounded ${
                              isResolved ? 'bg-emerald-500/20 text-emerald-400 font-bold' : 'bg-rose-500/10 text-rose-400'
                            }`}>
                              {isResolved ? 'RESOLVED ✓' : 'EXPLOITABLE'}
                            </span>
                          </div>
                          <h4 className="font-bold text-sm text-slate-100">{finding.title}</h4>
                          <p className="text-xs text-slate-400 font-mono line-clamp-1">{finding.affected_component}</p>
                          <div className="flex items-center justify-between pt-2 border-t text-xs">
                            <span className="text-[11px] font-mono text-cyan-400">Confidence: {finding.confidence}%</span>
                            <button
                              onClick={() => setSelectedFinding(finding)}
                              className="px-3 py-1 rounded-lg glass text-cyan-400 hover:text-white font-mono text-xs transition"
                            >
                              Investigate
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: FINDINGS TRACKER & INVESTIGATION */}
            {activeTab === 'findings' && (
              <div className="space-y-6">
                {/* Filters Header */}
                <div className="glass-card rounded-2xl p-5 space-y-4">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
                    <div>
                      <h3 className="text-base font-bold flex items-center space-x-2">
                        <Icon name="bug" size={18} className="text-cyan-400" />
                        <span>Central Security Findings Database</span>
                      </h3>
                      <p className="text-xs text-slate-400">
                        Synchronized single source of truth across Web UI and Voice Copilot.
                      </p>
                    </div>

                    {/* Search Input */}
                    <div className="relative">
                      <input
                        type="text"
                        placeholder="Search findings, IDs, components..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="glass-input px-3 py-1.5 pl-8 rounded-xl text-xs font-mono w-64 focus:outline-none focus:ring-1 focus:ring-cyan-500"
                      />
                      <div className="absolute left-2.5 top-2.5 text-slate-400">
                        <Icon name="search" size={12} />
                      </div>
                    </div>
                  </div>

                  {/* Filter Pills */}
                  <div className="flex flex-wrap items-center gap-2 pt-2 border-t">
                    <span className="text-xs font-mono text-slate-400 mr-2">Severity:</span>
                    {['ALL', 'CRITICAL', 'HIGH', 'MEDIUM', 'LOW'].map(sev => (
                      <button
                        key={sev}
                        onClick={() => setFindingsSeverity(sev)}
                        className={`px-3 py-1 rounded-lg text-xs font-mono font-semibold transition ${
                          findingsSeverity === sev ? 'bg-cyan-500 text-white shadow' : 'glass text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        {sev}
                      </button>
                    ))}

                    <span className="text-xs font-mono text-slate-400 ml-4 mr-2">Category:</span>
                    {['ALL', 'API Security', 'Code Security', 'AI Security (OWASP LLM01)', 'Secret Exposure', 'Web Security', 'Dependency CVE'].map(cat => (
                      <button
                        key={cat}
                        onClick={() => setFindingsCategory(cat)}
                        className={`px-2.5 py-1 rounded-lg text-xs font-mono transition ${
                          findingsCategory === cat ? 'bg-blue-600 text-white font-semibold' : 'glass text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Findings Table */}
                <div className="space-y-3">
                  {filteredFindings.map(finding => {
                    const isResolved = finding.status === 'RESOLVED' || finding.retest?.status === 'RESOLVED';
                    const isFixApplied = finding.remediation_applied || finding.status === 'Fix Applied';

                    return (
                      <div
                        key={finding.id}
                        className={`glass-card rounded-2xl p-5 space-y-4 transition ${
                          isResolved ? 'border-emerald-500/40 bg-emerald-950/10' : 'border-slate-800'
                        }`}
                      >
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b pb-3">
                          <div className="space-y-1">
                            <div className="flex items-center space-x-2">
                              <span className="text-xs font-mono font-bold px-2.5 py-0.5 rounded bg-slate-800 text-cyan-400 border border-slate-700">
                                {finding.id}
                              </span>
                              <span className={`text-[10px] font-bold font-mono px-2 py-0.5 rounded ${
                                finding.severity === 'CRITICAL' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' :
                                finding.severity === 'HIGH' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                                'bg-blue-500/20 text-blue-400 border border-blue-500/30'
                              }`}>
                                {finding.severity}
                              </span>
                              <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-700/50 text-slate-300">
                                {finding.category}
                              </span>
                              <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400">
                                Confidence: {finding.confidence}%
                              </span>
                              <span className={`text-[10px] font-mono px-2 py-0.5 rounded font-bold ${
                                isResolved ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
                                isFixApplied ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                                'bg-rose-500/20 text-rose-400 border border-rose-500/30'
                              }`}>
                                {isResolved ? 'VERIFIED RESOLVED ✓' : isFixApplied ? 'PATCH APPLIED (PENDING RE-TEST)' : 'CONFIRMED EXPLOITABLE'}
                              </span>
                            </div>
                            <h4 className="font-bold text-base text-slate-100">{finding.title}</h4>
                            <p className="text-xs text-slate-400 font-mono">{finding.affected_component} • {finding.affected_endpoint}</p>
                          </div>

                          {/* Quick Action Buttons */}
                          <div className="flex items-center space-x-2">
                            <button
                              onClick={() => setSelectedFinding(finding)}
                              className="px-3 py-1.5 rounded-lg glass hover:text-cyan-400 text-xs font-mono font-semibold flex items-center space-x-1 transition"
                            >
                              <Icon name="eye" size={13} />
                              <span>Deep Investigate</span>
                            </button>

                            {!isResolved && (
                              <button
                                onClick={() => handleApplyFix(finding.id)}
                                disabled={isApplyingFix || isFixApplied}
                                className="px-3 py-1.5 rounded-lg bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-mono font-bold flex items-center space-x-1 shadow transition disabled:opacity-50"
                              >
                                <Icon name="wrench" size={13} />
                                <span>{isFixApplied ? 'Patch Applied ✓' : 'Apply Fix'}</span>
                              </button>
                            )}

                            <button
                              onClick={() => handleRetestBackend(finding.id)}
                              disabled={isRetesting}
                              className="px-3 py-1.5 rounded-lg bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-mono font-bold flex items-center space-x-1 shadow transition disabled:opacity-50"
                            >
                              <Icon name="refresh" size={13} className={isRetesting ? 'animate-spin' : ''} />
                              <span>Re-Test Now</span>
                            </button>
                          </div>
                        </div>

                        {/* Evidence preview */}
                        <div className="glass-inner rounded-xl p-3 font-mono text-xs space-y-1">
                          {finding.evidence && finding.evidence.slice(0, 2).map((ev, idx) => (
                            <div key={idx} className="flex items-start space-x-2 text-slate-300">
                              <span className="text-cyan-400">›</span>
                              <span>{ev}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 3: INTERACTIVE LAB */}
            {activeTab === 'lab' && (
              <div className="space-y-6">
                <div className="glass-card rounded-2xl p-6">
                  <div className="flex items-center space-x-2 text-sm font-bold mb-1">
                    <Icon name="code" size={18} className="text-cyan-500" />
                    <span>Interactive Security Lab & Code Workbench</span>
                  </div>
                  <p className="text-xs text-slate-400">
                    Live static vulnerability detection. Select a scenario, run analysis, apply fix, and re-test.
                  </p>

                  <div className="flex flex-wrap gap-2 mt-4">
                    {Object.keys(LAB_SCENARIOS).map(key => (
                      <button
                        key={key}
                        onClick={() => {
                          setLabScenario(key);
                          setLabCode(LAB_SCENARIOS[key].vulnerable);
                          setCodeScanResult(null);
                        }}
                        className={`px-3 py-1.5 rounded-lg text-xs font-mono transition ${
                          labScenario === key ? 'bg-cyan-500 text-white font-bold' : 'glass text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        {LAB_SCENARIOS[key].name}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  <div className="glass-card rounded-2xl p-5 space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="font-mono text-xs font-bold text-cyan-400">
                        {LAB_SCENARIOS[labScenario].filename}
                      </span>
                      <button
                        onClick={() => setLabCode(LAB_SCENARIOS[labScenario].fixed)}
                        className="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-mono font-semibold transition"
                      >
                        Load Recommended Fix
                      </button>
                    </div>

                    <textarea
                      rows={12}
                      value={labCode}
                      onChange={(e) => setLabCode(e.target.value)}
                      className="w-full glass-inner p-3 rounded-xl font-mono text-xs focus:outline-none focus:ring-1 focus:ring-cyan-500 leading-relaxed"
                    />

                    <button
                      onClick={handleScanLabCode}
                      disabled={isScanningCode}
                      className="w-full py-2 bg-gradient-to-r from-cyan-500 to-blue-600 text-white rounded-xl text-xs font-bold font-mono flex items-center justify-center space-x-2 shadow transition"
                    >
                      <Icon name="play" size={13} />
                      <span>{isScanningCode ? 'Analyzing Code...' : 'Run Real Static Code Analysis'}</span>
                    </button>
                  </div>

                  <div className="glass-card rounded-2xl p-5 space-y-4">
                    <h4 className="font-bold text-xs font-mono uppercase text-slate-400 tracking-wider">
                      Live Code Telemetry
                    </h4>

                    {!codeScanResult && (
                      <div className="glass-inner p-8 rounded-xl text-center text-xs text-slate-400">
                        Click "Run Real Static Code Analysis" to inspect code for SQLi, exposed secrets, and prompt injection.
                      </div>
                    )}

                    {codeScanResult?.findings?.length === 0 && (
                      <div className="glass-inner p-6 rounded-xl text-center space-y-2 border border-emerald-500/40">
                        <div className="text-emerald-400 font-bold font-mono text-sm flex items-center justify-center space-x-1.5">
                          <Icon name="checkCircle" size={16} />
                          <span>VERIFIED RESOLVED ✓</span>
                        </div>
                        <p className="text-xs text-slate-400">
                          Re-test verification passed. Zero unescaped queries or exposed tokens detected.
                        </p>
                      </div>
                    )}

                    {codeScanResult?.findings?.map((f, i) => (
                      <div key={i} className="glass-inner p-4 rounded-xl space-y-2 border border-rose-500/30">
                        <div className="flex items-center space-x-2">
                          <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-rose-500/20 text-rose-400 font-bold">
                            {f.severity}
                          </span>
                          <span className="font-bold text-xs">{f.title}</span>
                        </div>
                        <p className="text-xs text-slate-400">{f.technical_explanation}</p>
                        <div className="text-[11px] font-mono text-rose-400 bg-black/40 p-2 rounded">
                          {f.vulnerable_code}
                        </div>
                        <div className="text-[11px] font-mono text-emerald-400">
                          Fix: {f.remediation.recommended_fix}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: ATTACK PATHS & ARCHITECTURE */}
            {activeTab === 'architecture' && (() => {
              const attackPathList = backendState?.attack_path_list ||
