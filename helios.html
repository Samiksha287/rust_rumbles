                (backendState?.attack_paths ? (Array.isArray(backendState.attack_paths) ? backendState.attack_paths : Object.values(backendState.attack_paths)) : []);
              const currentPath = attackPathList.find(p => p.id === selectedAttackPathId) || attackPathList[0] || null;
              const isCurrentMitigated = currentPath && canonicalFindings.some(f => (f.id === currentPath.finding_id || f.attack_path === currentPath.id) && (f.status === 'RESOLVED' || f.retest?.status === 'RESOLVED'));

              return (
                <div className="space-y-6">
                  {/* Attack Path Selector & Overview */}
                  <div className="glass-card rounded-2xl p-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-4 mb-5">
                      <div>
                        <div className="flex items-center space-x-2 text-base font-bold">
                          <Icon name="branch" size={18} className="text-cyan-400" />
                          <span>Attack-Path Engine & Exploit Graphs</span>
                        </div>
                        <p className="text-xs text-slate-400 mt-0.5">
                          Multi-hop exploit chaining from public entry points to crown jewel compromise.
                        </p>
                      </div>

                      {/* Path Selector Tabs */}
                      <div className="flex flex-wrap gap-2">
                        {attackPathList.map(ap => {
                          const isMit = canonicalFindings.some(f => (f.id === ap.finding_id || f.attack_path === ap.id) && (f.status === 'RESOLVED' || f.retest?.status === 'RESOLVED'));
                          const isSelected = currentPath && currentPath.id === ap.id;
                          return (
                            <button
                              key={ap.id}
                              onClick={() => setSelectedAttackPathId(ap.id)}
                              className={`px-3 py-1.5 rounded-xl font-mono text-xs flex items-center space-x-2 transition ${
                                isSelected
                                  ? 'bg-cyan-500 text-white shadow-lg shadow-cyan-500/20 font-bold'
                                  : 'glass text-slate-400 hover:text-slate-200'
                              }`}
                            >
                              <span>{ap.id}</span>
                              <span className={`h-2 w-2 rounded-full ${isMit ? 'bg-emerald-400' : 'bg-rose-500'}`}></span>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {currentPath ? (
                      <div className="space-y-5">
                        {/* Status Header */}
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 glass-inner p-4 rounded-xl border border-slate-700/50">
                          <div className="space-y-1">
                            <div className="flex items-center space-x-2">
                              <span className="font-mono text-xs px-2.5 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 font-bold">
                                {currentPath.id}
                              </span>
                              <span className={`font-mono text-xs px-2.5 py-0.5 rounded font-bold ${
                                currentPath.severity === 'CRITICAL' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                              }`}>
                                {currentPath.severity}
                              </span>
                              <span className={`font-mono text-xs px-2.5 py-0.5 rounded font-bold ${
                                isCurrentMitigated ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'
                              }`}>
                                {isCurrentMitigated ? 'VECTOR MITIGATED ✓' : 'EXPLOIT CHAIN ACTIVE'}
                              </span>
                            </div>
                            <h4 className="text-base font-bold text-slate-100">{currentPath.title}</h4>
                            <div className="text-xs text-slate-400 font-mono">
                              Root Cause: <strong className="text-slate-300">{currentPath.root_cause || 'Missing authorization check'}</strong>
                            </div>
                          </div>

                          <div className="text-right space-y-1 sm:min-w-[200px]">
                            <div className="text-[11px] font-mono text-slate-400 uppercase tracking-wider">Blast Radius</div>
                            <div className="text-xs font-mono font-bold text-rose-400">{currentPath.blast_radius}</div>
                          </div>
                        </div>

                        {/* Interactive Exploit Chain Flow */}
                        <div>
                          <div className="text-xs font-mono uppercase tracking-wider text-slate-400 font-bold mb-3 flex items-center space-x-1.5">
                            <Icon name="terminal" size={14} className="text-cyan-400" />
                            <span>Execution Hop Sequence</span>
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                            {currentPath.steps && currentPath.steps.map((step, idx) => {
                              const isLast = idx === currentPath.steps.length - 1;
                              const isFirst = idx === 0;
                              return (
                                <div
                                  key={idx}
                                  className={`p-4 rounded-xl relative flex flex-col justify-between space-y-2 border transition ${
                                    isCurrentMitigated
                                      ? 'border-emerald-500/30 bg-emerald-950/10'
                                      : isLast
                                      ? 'border-rose-500/50 bg-rose-950/20'
                                      : 'border-slate-700/60 glass-inner'
                                  }`}
                                >
                                  <div className="flex items-center justify-between">
                                    <span className="font-mono text-[10px] text-slate-400 font-bold">
                                      HOP {step.step || (idx + 1)}
                                    </span>
                                    <span className={`text-[9px] font-mono px-2 py-0.5 rounded font-bold ${
                                      isCurrentMitigated ? 'bg-emerald-500/20 text-emerald-400' :
                                      step.status === 'CRITICAL_IMPACT' ? 'bg-rose-500/20 text-rose-400' :
                                      step.status === 'VULNERABLE' ? 'bg-amber-500/20 text-amber-400' :
                                      'bg-blue-500/20 text-blue-400'
                                    }`}>
                                      {isCurrentMitigated ? 'MITIGATED' : (step.status || 'ACTIVE')}
                                    </span>
                                  </div>

                                  <div className="space-y-1 my-2">
                                    <div className="font-bold text-sm text-slate-100">{step.name}</div>
                                    <p className="text-xs text-slate-400 leading-relaxed">{step.desc}</p>
                                  </div>

                                  <div className="pt-2 border-t border-slate-700/40 text-[10px] font-mono text-cyan-400/90">
                                    {isFirst ? '● Entry Vector' : isLast ? '★ Crown Jewel Target' : '➔ Lateral Hop'}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>

                        {/* Explanation & Threat Model */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                          <div className="md:col-span-2 glass-inner p-4 rounded-xl space-y-2 border border-slate-700/50">
                            <span className="font-mono uppercase font-bold text-slate-400 text-[11px]">Exploit Threat Model:</span>
                            <p className="text-slate-300 leading-relaxed">{currentPath.explanation}</p>
                            <div className="text-[11px] font-mono text-cyan-400 pt-1">
                              Entry Point: <span className="text-slate-300">{currentPath.entry_point}</span>
                            </div>
                            <div className="text-[11px] font-mono text-rose-400">
                              Crown Jewels at Risk: <span className="text-slate-300">{currentPath.crown_jewels}</span>
                            </div>
                          </div>

                          <div className="glass-inner p-4 rounded-xl flex flex-col justify-between space-y-3 border border-slate-700/50">
                            <div>
                              <span className="font-mono uppercase font-bold text-slate-400 text-[11px]">Remediation Vector:</span>
                              <div className="text-xs text-slate-300 mt-1">
                                {isCurrentMitigated ? (
                                  <span className="text-emerald-400 font-bold">✓ This attack vector has been fully mitigated by applied security patch.</span>
                                ) : (
                                  <span>Associated vulnerability: <strong>{currentPath.finding_id || 'HLS-API-102'}</strong> is active.</span>
                                )}
                              </div>
                            </div>

                            {currentPath.finding_id && (
                              <button
                                onClick={() => {
                                  const f = canonicalFindings.find(x => x.id === currentPath.finding_id);
                                  if (f) setSelectedFinding(f);
                                }}
                                className="w-full py-2 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-mono text-xs font-bold shadow transition flex items-center justify-center space-x-1.5"
                              >
                                <Icon name="eye" size={13} />
                                <span>Investigate Vulnerability</span>
                              </button>
                            )}
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div className="text-xs text-slate-400 font-mono py-8 text-center">
                        Zero active attack paths discovered. Run an assessment to populate exploit graphs.
                      </div>
                    )}
                  </div>

                  {/* Microservices Topology & Security Boundaries */}
                  {backendState?.architecture && (
                    <div className="glass-card rounded-2xl p-6 space-y-5">
                      <div className="flex items-center justify-between border-b pb-3">
                        <h4 className="font-bold text-sm flex items-center space-x-2">
                          <Icon name="activity" size={16} className="text-cyan-400" />
                          <span>System Architecture & Component Topology</span>
                        </h4>
                        <span className="text-xs font-mono text-slate-400">
                          Auth: {backendState.architecture.auth_mechanism || 'JWT Scopes'}
                        </span>
                      </div>

                      {/* Services Grid */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                        {backendState.architecture.services && backendState.architecture.services.map(srv => (
                          <div key={srv.id} className="glass-inner p-4 rounded-xl space-y-2 border border-slate-700/50">
                            <div className="flex items-center justify-between">
                              <span className="text-[10px] font-mono text-cyan-400 font-bold">{srv.id}</span>
                              <span className={`text-[9px] font-mono px-2 py-0.5 rounded font-bold ${
                                srv.status === 'HARDENED' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'
                              }`}>
                                {srv.status}
                              </span>
                            </div>
                            <div className="font-bold text-xs text-slate-100">{srv.name}</div>
                            <div className="text-[11px] text-slate-400 font-mono">Port {srv.port} • {srv.technology}</div>
                          </div>
                        ))}
                      </div>

                      {/* APIs & Endpoints Table */}
                      <div className="space-y-2">
                        <div className="text-xs font-mono uppercase tracking-wider text-slate-400 font-bold">
                          Audited Endpoints & Attack Surface
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                          {backendState.architecture.apis && backendState.architecture.apis.map((api, i) => (
                            <div key={i} className="glass-inner p-3 rounded-xl flex items-center justify-between text-xs font-mono border border-slate-700/40">
                              <div className="flex items-center space-x-2">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                  api.method === 'GET' ? 'bg-blue-500/20 text-blue-400' : 'bg-emerald-500/20 text-emerald-400'
                                }`}>
                                  {api.method}
                                </span>
                                <span className="text-slate-200">{api.endpoint}</span>
                              </div>
                              <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${
                                api.vulnerable ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/20 text-emerald-400'
                              }`}>
                                {api.vulnerable ? 'VULNERABLE' : 'SECURE'}
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Storage & Boundaries */}
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2 text-xs font-mono">
                        <div className="glass-inner p-3.5 rounded-xl space-y-1 border border-slate-700/40">
                          <span className="text-[10px] uppercase text-slate-400 font-bold">Databases & Caches:</span>
                          {backendState.architecture.databases && backendState.architecture.databases.map((db, i) => (
                            <div key={i} className="text-slate-300">› {db}</div>
                          ))}
                        </div>
                        <div className="glass-inner p-3.5 rounded-xl space-y-1 border border-slate-700/40">
                          <span className="text-[10px] uppercase text-slate-400 font-bold">Public Ingress Gateways:</span>
                          {backendState.architecture.entry_points && backendState.architecture.entry_points.map((ep, i) => (
                            <div key={i} className="text-cyan-400 truncate">› {ep}</div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              );
            })()}

            {/* TAB 5: CISO REPORT */}
            {activeTab === 'report' && (
              <div className="glass-card rounded-2xl p-8 space-y-6">
                <div className="flex items-center justify-between border-b pb-4">
                  <div>
                    <h2 className="text-xl font-bold">HELIOS CISO SECURITY AUDIT REPORT</h2>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Target: {activeProject?.name || 'Banking API'} ({activeProject?.target_url}) • Generated: {new Date().toLocaleDateString()}
                    </p>
                  </div>
                  <button
                    onClick={() => window.print()}
                    className="px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 text-white rounded-xl text-xs font-mono font-bold shadow no-print"
                  >
                    Print / Export PDF
                  </button>
                </div>

                {/* Executive Posture Score Box */}
                <div className="glass-inner p-5 rounded-xl border border-cyan-500/30 flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div>
                    <div className="text-xs font-mono uppercase text-slate-400">Post-Remediation Security Posture</div>
                    <div className="text-3xl font-black mt-1 text-emerald-400 flex items-baseline space-x-3">
                      <span>{currentRiskScore}/100</span>
                      <span className="text-xs font-mono text-slate-300 font-normal">
                        Initial Score: <strong>{initialRiskScore}/100</strong>
                      </span>
                      <span className="text-xs font-mono px-2.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold">
                        Score Improvement: +{currentRiskScore - initialRiskScore} Pts
                      </span>
                    </div>
                  </div>
                  <div className="text-xs font-mono text-slate-400 text-right">
                    <div>Attestation Framework: SOC2 CC6.1, OWASP API Top 10, PCI-DSS 6.5</div>
                    <div className="text-emerald-400 font-bold mt-1">Autonomous Verification: Passed 100%</div>
                  </div>
                </div>

                {/* Summary Matrix */}
                <div className="glass-inner p-4 rounded-xl grid grid-cols-2 md:grid-cols-4 gap-4 text-center font-mono text-xs">
                  <div>
                    <div className="text-2xl font-bold text-rose-500">{activeFindingsCount}</div>
                    <div className="text-slate-400 mt-1">Remaining Vulnerabilities</div>
                  </div>
                  <div>
                    <div className="text-2xl font-bold text-emerald-400">{resolvedFindingsCount}</div>
                    <div className="text-slate-400 mt-1">Remediated & Verified</div>
                  </div>
                  <div>
                    <div className="text-2xl font-bold text-cyan-400">{canonicalFindings.length}</div>
                    <div className="text-slate-400 mt-1">Total Signals Evaluated</div>
                  </div>
                  <div>
                    <div className="text-2xl font-bold text-indigo-400">100%</div>
                    <div className="text-slate-400 mt-1">Real Evidence Proven</div>
                  </div>
                </div>

                {/* Canonical Findings Breakdown */}
                <div className="space-y-3">
                  <h4 className="font-bold text-sm">Detailed Vulnerability Register</h4>
                  <div className="space-y-2">
                    {canonicalFindings.map(f => {
                      const isResolved = f.status === 'RESOLVED' || f.retest?.status === 'RESOLVED';
                      return (
                        <div key={f.id} className="p-3.5 rounded-xl glass flex items-center justify-between text-xs">
                          <div className="space-y-1">
                            <div className="flex items-center space-x-2">
                              <span className="font-mono font-bold text-cyan-400">{f.id}</span>
                              <span className="font-semibold text-slate-200">{f.title}</span>
                              <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">{f.category}</span>
                            </div>
                            <div className="text-[11px] text-slate-400 font-mono">{f.affected_component}</div>
                          </div>
                          <span className={`font-mono text-[11px] px-2.5 py-1 rounded font-bold ${
                            isResolved ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'
                          }`}>
                            {isResolved ? 'RESOLVED ✓' : 'UNRESOLVED'}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 6: AUDIT TELEMETRY */}
            {activeTab === 'audit' && (
              <div className="glass-card rounded-2xl p-6 space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <div className="flex items-center space-x-2 text-sm font-bold">
                    <Icon name="terminal" size={18} className="text-cyan-500" />
                    <span>Real-Time Audit Telemetry & Immutable Logs</span>
                  </div>
                  <span className="text-xs font-mono text-slate-400">
                    Chronological actions recorded across Web UI & Voice Copilot
                  </span>
                </div>

                <div className="space-y-2 max-h-[600px] overflow-y-auto">
                  {backendState?.audit_logs && backendState.audit_logs.map((log, idx) => (
                    <div key={idx} className="glass-inner p-3 rounded-xl font-mono text-xs flex items-center justify-between border border-slate-700/40">
                      <div className="space-y-1">
                        <div className="flex items-center space-x-2">
                          <span className="text-cyan-400 font-bold">{log.tool || log.action}</span>
                          <span className="text-slate-400">•</span>
                          <span className="text-slate-300">{log.action || log.details}</span>
                        </div>
                        <div className="text-[11px] text-slate-500">Actor: {log.user || 'Voice/UI Copilot'} • Target: {log.target_url || log.target || 'System'}</div>
                      </div>
                      <div className="text-right space-y-1">
                        <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${
                          log.status === 'RESOLVED' || log.status === 'SUCCESS' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700 text-slate-300'
                        }`}>
                          {log.status}
                        </span>
                        <div className="text-[10px] text-slate-500">{log.timestamp}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* ─── REAL-TIME TWO-WAY VOICE COPILOT ORB ─── */}
          <VoiceCopilot
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            currentUrl={targetUrl}
            onTriggerScan={handleVoiceScanTrigger}
            onTriggerRetest={handleVoiceRetestTrigger}
            theme={theme}
            toggleTheme={toggleTheme}
            backendState={backendState}
            onSyncBackend={syncBackendState}
            onSelectFinding={(fid) => {
              if (backendState?.findings) {
                const f = backendState.findings.find(x => x.id === fid || x.display_id === fid);
                if (f) {
                  setSelectedFinding(f);
                  setActiveTab('findings');
                }
              }
            }}
            selectedFindingId={selectedFinding?.id}
          />

          {/* ─── DEEP INVESTIGATION MODAL ─── */}
          <FindingModal
            finding={selectedFinding}
            onClose={() => setSelectedFinding(null)}
            onApplyFix={handleApplyFix}
            onRetest={handleRetestBackend}
            isApplying={isApplyingFix}
            isRetesting={isRetesting}
          />

          {/* ─── SETTINGS MODAL ─── */}
          <SettingsModal
            isOpen={isSettingsOpen}
            onClose={() => setIsSettingsOpen(false)}
          />

          <footer className="glass px-6 py-3 border-t text-center text-xs font-mono text-slate-400 no-print flex items-center justify-between">
            <span>HELIOS Autonomous Security Engineer • Unified Single Source of Truth</span>
            <span>Build with AI. Secure with HELIOS.</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
