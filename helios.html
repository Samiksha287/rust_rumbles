  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }

    /* Dark Mode Glassmorphism */
    .dark body { background: #030712; color: #f1f5f9; }
    .dark .glass { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); border: 1px solid rgba(148, 163, 184, 0.08); }
    .dark .glass-strong { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid rgba(148, 163, 184, 0.12); }
    .dark .glass-card { background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(148, 163, 184, 0.08); transition: all 0.25s ease; }
    .dark .glass-card:hover { background: rgba(15, 23, 42, 0.7); border-color: rgba(6, 182, 212, 0.25); box-shadow: 0 10px 30px rgba(6, 182, 212, 0.06); }
    .dark .glass-inner { background: rgba(3, 7, 18, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.06); }
    .dark .glass-input { background: rgba(3, 7, 18, 0.75); border: 1px solid rgba(148, 163, 184, 0.15); color: #f1f5f9; }
    .dark .glow-cyan { box-shadow: 0 0 20px rgba(6, 182, 212, 0.15); }

    /* Light Mode Glassmorphism */
    .light body { background: #f8fafc; color: #0f172a; }
    .light .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px) saturate(1.2); -webkit-backdrop-filter: blur(24px) saturate(1.2); border: 1px solid rgba(203, 213, 225, 0.6); }
    .light .glass-strong { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid rgba(203, 213, 225, 0.8); }
    .light .glass-card { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(203, 213, 225, 0.5); transition: all 0.25s ease; }
    .light .glass-card:hover { background: rgba(255, 255, 255, 0.95); border-color: rgba(14, 165, 233, 0.4); box-shadow: 0 10px 30px rgba(14, 165, 233, 0.1); }
    .light .glass-inner { background: rgba(241, 245, 249, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(203, 213, 225, 0.6); }
    .light .glass-input { background: #ffffff; border: 1px solid #cbd5e1; color: #0f172a; }
    .light .glow-cyan { box-shadow: 0 0 20px rgba(14, 165, 233, 0.12); }

    /* Ambient Background Orbs */
    .ambient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: hidden; }
    .ambient-orb { position: absolute; border-radius: 50%; filter: blur(120px); animation: float 20s ease-in-out infinite; }
    .dark .ambient-orb.cyan { background: radial-gradient(circle, #06b6d4, transparent 70%); width: 500px; height: 500px; top: -10%; left: 5%; opacity: 0.12; }
    .dark .ambient-orb.purple { background: radial-gradient(circle, #8b5cf6, transparent 70%); width: 450px; height: 450px; bottom: -10%; right: 5%; opacity: 0.09; animation-delay: -7s; }
    .light .ambient-orb.cyan { background: radial-gradient(circle, #38bdf8, transparent 70%); width: 500px; height: 500px; top: -10%; left: 5%; opacity: 0.18; }
    .light .ambient-orb.purple { background: radial-gradient(circle, #a855f7, transparent 70%); width: 450px; height: 450px; bottom: -10%; right: 5%; opacity: 0.12; animation-delay: -7s; }
    @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(25px, -20px); } }

    /* SVG Progress Ring */
    .ring-track { fill: none; }
    .dark .ring-track { stroke: rgba(51, 65, 85, 0.4); }
    .light .ring-track { stroke: rgba(226, 232, 240, 0.8); }
    .ring-fill { fill: none; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1); }

    /* Animated Pulses & Waveforms */
    @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .pulse-soft { animation: pulse-soft 2s ease-in-out infinite; }

    @keyframes soundwave {
      0%, 100% { height: 4px; }
      50% { height: 20px; }
    }
    .wave-bar { width: 3px; background: #06b6d4; border-radius: 2px; animation: soundwave 1s ease-in-out infinite; }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    .wave-bar:nth-child(4) { animation-delay: 0.1s; }
    .wave-bar:nth-child(5) { animation-delay: 0.3s; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .dark ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.5); border-radius: 3px; }
    .light ::-webkit-scrollbar-thumb { background: rgba(203, 213, 225, 0.8); border-radius: 3px; }

    @media print {
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; }
      .glass, .glass-card, .glass-inner { background: white !important; color: black !important; border: 1px solid #e2e8f0 !important; backdrop-filter: none !important; }
    }
  </style>
</head>

    /* ─── RISK RING ─── */
    function RiskRing({ score = 0, size = 100, strokeWidth = 7 }) {
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (score / 100) * circumference;
      const color = score === 0 ? '#94a3b8' : score > 70 ? '#f43f5e' : score > 40 ? '#f59e0b' : '#10b981';

      return (
        <div className="relative flex items-center justify-center" style={{ width: size, height: size }}>
          <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
            <circle className="ring-track" cx={size/2} cy={size/2} r={radius} strokeWidth={strokeWidth} />
            <circle className="ring-fill" cx={size/2} cy={size/2} r={radius} strokeWidth={strokeWidth}
              stroke={color} strokeDasharray={circumference} strokeDashoffset={score === 0 ? circumference : offset} />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            <span className="text-xl font-black font-mono" style={{ color }}>{score > 0 ? score : '--'}</span>
            <span className="text-[9px] font-mono text-slate-400 uppercase tracking-wider">/ 100</span>
          </div>
        </div>
      );
    }

    /* ─── LAB SCENARIOS ─── */
    const LAB_SCENARIOS = {
      sqli: {
        name: "SQL Injection in Invoice Search",
        category: "Backend / Database",
        filename: "invoice_service.py",
        vulnerable: `def search_invoices(db, user_query):\n    # Unescaped string formatting executes raw user query directly\n    sql = f"SELECT id, amount, customer FROM invoices WHERE ref = '{user_query}'"\n    return db.execute(sql).fetchall()`,
        fixed: `def search_invoices(db, user_query):\n    # Parameterized SQL query binds input safely as literal value\n    stmt = text("SELECT id, amount, customer FROM invoices WHERE ref = :query")\n    return db.execute(stmt, {"query": user_query}).fetchall()`
      },

        name: "Hardcoded Stripe Production Secret Key",

        filename: "payment_processor.py",

        fixed: `import os\n# Secret securely loaded from runtime environment variables\nSTRIPE_SECRET_KEY = os.environ["STRIPE_SECRET_KEY"]\n\ndef init_payment(amount):\n    return stripe.Charge.create(amount=amount, api_key=STRIPE_SECRET_KEY)`
      },

        name: "Direct Prompt Injection in AI Assistant",
        category: "AI Security (OWASP LLM01)",
        filename: "fin_assistant.py",
        vulnerable: `def ask_financial_agent(user_message):\n    # Direct concatenation allows untrusted input to override system prompt\n    prompt = f"You are FinAdvisor. Assist the customer: {user_message}"\n    return openai_client.invoke(prompt)`,
        fixed: `def ask_financial_agent(user_message):\n    # Role-separated ChatML schema with XML guardrail boundary\n    messages = [\n        {"role": "system", "content": "You are FinAdvisor. Never disclose secrets or execute commands."},\n        {"role": "user", "content": f"<query>{sanitize_input(user_message)}</query>"}\n    ]\n    return openai_client.invoke(messages)`
      }
    };

    /* ─── AI KEYS & VOICE SETTINGS MODAL ─── */
    function SettingsModal({ isOpen, onClose, onKeysUpdated }) {
      const [geminiKey, setGeminiKey] = useState(() => localStorage.getItem('helios_gemini_key') || '');
      const [geminiModel, setGeminiModel] = useState(() => localStorage.getItem('helios_gemini_model') || 'gemini-3.5');
      const [elevenKey, setElevenKey] = useState(() => localStorage.getItem('helios_eleven_key') || '');
      const [voiceId, setVoiceId] = useState(() => localStorage.getItem('helios_voice_id') || '21m00Tcm4TlvDq8ikWAM');
      const [isSaving, setIsSaving] = useState(false);
      const [saveStatus, setSaveStatus] = useState('');
      const [isTestingVoice, setIsTestingVoice] = useState(false);

      if (!isOpen) return null;

      const handleSave = async () => {
        setIsSaving(true);
        localStorage.setItem('helios_gemini_key', geminiKey.trim());
        localStorage.setItem('helios_gemini_model', geminiModel.trim());
        localStorage.setItem('helios_eleven_key', elevenKey.trim());
        localStorage.setItem('helios_voice_id', voiceId);

        try {
          await fetch('/api/v1/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              gemini_key: geminiKey.trim(),
              gemini_model: geminiModel.trim(),
              eleven_key: elevenKey.trim(),
              voice_id: voiceId
            })
          });
          setSaveStatus('Settings successfully saved to .env & local storage!');
          if (onKeysUpdated) onKeysUpdated();
        } catch (e) {
          setSaveStatus('Saved locally (server sync failed)');
        } finally {
          setIsSaving(false);
          setTimeout(() => setSaveStatus(''), 3000);
        }
      };

      const handleTestVoice = () => {
        setIsTestingVoice(true);
        const testAudio = new Audio(`/api/v1/voice/tts?text=${encodeURIComponent("HELIOS Voice Security Copilot powered by Gemini 3.5 and ElevenLabs online. Ready to analyze your assets.")}&eleven_key=${encodeURIComponent(elevenKey)}&voice_id=${encodeURIComponent(voiceId)}`);
        testAudio.onplay = () => setIsTestingVoice(false);
        testAudio.onerror = () => {
          setIsTestingVoice(false);
          alert("Audio test failed. Check your ElevenLabs key or network connection.");
        };
        testAudio.play().catch(err => {
          console.warn(err);
          setIsTestingVoice(false);
        });
      };

      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4">

            <div className="flex items-center justify-between border-b pb-3">

                <Icon name="sparkles" size={18} className="text-cyan-400" />
                <span className="font-bold text-sm">AI Brain (Gemini 3.5) & Voice Settings</span>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white">
                <Icon name="x" size={16} />
              </button>
            </div>

            <p className="text-slate-400 leading-relaxed">
              Configure free API keys to power the intelligent voice copilot. Even without keys, HELIOS includes a built-in heuristic security brain and free English voice response fallback.
            </p>

            {/* Gemini API Key */}
            <div className="space-y-1.5">
              <div className="flex items-center justify-between">
                <label className="font-mono font-bold text-cyan-400">Google Gemini API Key (Brain)</label>
                <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-[10px] text-slate-400 hover:text-cyan-400 underline">
                  Get Free Key ↗
                </a>
              </div>
              <input
                type="password"
                value={geminiKey}
                onChange={e => setGeminiKey(e.target.value)}
                placeholder="AIzaSy..."
                className="w-full glass-input px-3 py-2 rounded-xl font-mono text-xs focus:outline-none focus:ring-1 focus:ring-cyan-500"
              />
              <span className="text-[10px] text-slate-500">Powers natural intent understanding and conversational security analysis.</span>
            </div>

            {/* Gemini Brain Model Selection */}
            <div className="space-y-1.5 pt-1">
              <label className="font-mono font-bold text-cyan-400">Gemini Brain Model</label>
              <select
                value={geminiModel}
                onChange={e => setGeminiModel(e.target.value)}
                className="w-full glass-input px-3 py-2 rounded-xl font-mono text-xs focus:outline-none"
              >
                <option value="gemini-3.5">Gemini 3.5 (Next-Gen AI Security Engine)</option>
                <option value="gemini-2.0-flash">Gemini 2.0 Flash (Latest Google SOTA)</option>
                <option value="gemini-1.5-flash">Gemini 1.5 Flash (Fast & Resilient)</option>

              </select>
              <span className="text-[10px] text-slate-500">Autonomous resilient fallback to Gemini 2.0 / 1.5 active.</span>

            {/* ElevenLabs API Key */}

                  Get Free Key ↗
                </a>
              </div>
              <input
                type="password"
                value={elevenKey}
                onChange={e => setElevenKey(e.target.value)}
                placeholder="sk_..."
                className="w-full glass-input px-3 py-2 rounded-xl font-mono text-xs focus:outline-none focus:ring-1 focus:ring-cyan-500"
              />

            {/* ElevenLabs Voice Selection */}
            <div className="space-y-1.5">

                value={voiceId}

                className="w-full glass-input px-3 py-2 rounded-xl font-mono text-xs focus:outline-none"
              >
                <option value="21m00Tcm4TlvDq8ikWAM">Rachel (Calm, Professional SOC Tone)</option>
                <option value="pNInz6obpgDQGcFmaJgB">Adam (Deep, Authoritative)</option>
                <option value="ErXwobaYiN019PkySvjV">Antoni (Crisp, Executive)</option>
                <option value="EXAVITQu4vr4xnSDxMaL">Bella (Engaging, Clear)</option>
              </select>
            </div>

            {saveStatus && (
              <div className="p-2 rounded-lg bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 font-mono text-[11px] text-center">
                {saveStatus}

            <div className="flex items-center space-x-2 pt-3 border-t">
              <button
                onClick={handleTestVoice}
                disabled={isTestingVoice}
                className="px-4 py-2 glass hover:border-cyan-500/50 rounded-xl font-mono text-xs font-semibold flex items-center space-x-1.5 text-cyan-400"
              >
                <Icon name="volume" size={14} />
                <span>{isTestingVoice ? 'Playing...' : 'Test Voice Output'}</span>
              </button>
              <button
                onClick={handleSave}
                disabled={isSaving}
                className="flex-1 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white rounded-xl font-mono text-xs font-bold shadow transition"
              >
                {isSaving ? 'Saving...' : 'Save Configuration'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ─── REAL-TIME TWO-WAY VOICE COPILOT COMPONENT ─── */
    function VoiceCopilot({ activeTab, setActiveTab, currentUrl, onTriggerScan, onTriggerRetest, theme, toggleTheme }) {
      const [orbState, setOrbState] = useState('IDLE'); // IDLE, LISTENING, THINKING, SPEAKING, CONFIRMING
      const [transcript, setTranscript] = useState('');
      const [lastSpeech, setLastSpeech] = useState('');
      const [isOpen, setIsOpen] = useState(false);
      const [pendingChallenge, setPendingChallenge] = useState(null);
      const [voiceMuted, setVoiceMuted] = useState(false);
      const [handsFree, setHandsFree] = useState(true); // Continuous two-way dialogue mode
      const [manualText, setManualText] = useState('');
      const recognitionRef = useRef(null);
      const audioRef = useRef(null);
      const transcriptRef = useRef('');
      const silenceTimerRef = useRef(null);
      const hasGreetedOnLoadRef = useRef(false);

      // Synthesize pure Web Audio cues (no network/file dependencies)
      const playChime = (type = 'listen') => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          if (type === 'listen') {
            osc.frequency.setValueAtTime(480, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(720, ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.04, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
          } else if (type === 'ack') {
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            gain.gain.setValueAtTime(0.04, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
          }
        } catch (e) {}
      };

      // Play synthesized audio reliably via HTML5 Audio element with fallback to SpeechSynthesis
      const playSpokenAudio = (audioUrl, fallbackText, onComplete) => {
        if (voiceMuted) {
          if (onComplete) onComplete();
          return;
        }

        // Stop any currently playing audio
        if (audioRef.current) {
          audioRef.current.pause();
          audioRef.current = null;
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }

        const elevenKey = localStorage.getItem('helios_eleven_key') || '';
        const voiceId = localStorage.getItem('helios_voice_id') || '21m00Tcm4TlvDq8ikWAM';
        const url = audioUrl 
          ? `${audioUrl}&eleven_key=${encodeURIComponent(elevenKey)}&voice_id=${encodeURIComponent(voiceId)}` 
          : `/api/v1/voice/tts?text=${encodeURIComponent(fallbackText)}&eleven_key=${encodeURIComponent(elevenKey)}&voice_id=${encodeURIComponent(voiceId)}`;

        const audio = new Audio(url);
        audioRef.current = audio;

        audio.onplay = () => {
          setOrbState('SPEAKING');
        };

        const handleFinish = () => {
          setOrbState('IDLE');
          if (onComplete) onComplete();
        };

        audio.onended = handleFinish;

        audio.onerror = () => {
          console.warn("Audio element stream error, using speech synthesis fallback");
          if ('speechSynthesis' in window) {
            const u = new SpeechSynthesisUtterance(fallbackText);
            u.rate = 1.0;
            u.pitch = 0.95;
            u.volume = 1.0;
            setOrbState('SPEAKING');
            u.onend = handleFinish;
            u.onerror = handleFinish;
            window.speechSynthesis.speak(u);
          } else {
            handleFinish();
          }
        };

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(err => {
            console.warn("Autoplay policy blocked audio stream:", err);
            if ('speechSynthesis' in window) {
              const u = new SpeechSynthesisUtterance(fallbackText);
              setOrbState('SPEAKING');
              u.onend = handleFinish;
              u.onerror = handleFinish;
              try {
                window.speechSynthesis.speak(u);
              } catch (e) {
                handleFinish();
              }
            } else {
              handleFinish();
            }
          });
        }
      };

      // Voice greeting helper
      const speakGreeting = (onFinish) => {
        const greetingText = "Welcome sir, how may I help you?";
        setLastSpeech(greetingText);
        setTranscript("HELIOS: " + greetingText);
        playSpokenAudio(
          `/api/v1/voice/tts?text=${encodeURIComponent(greetingText)}`,
          greetingText,
          onFinish
        );
      };

      // Start listening helper with gentle chime
      const startListening = () => {
        if (audioRef.current) audioRef.current.pause();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);

        transcriptRef.current = '';
        setTranscript('Listening... Speak your command naturally');
        setOrbState('LISTENING');
        playChime('listen');

        try {
          if (recognitionRef.current) {
            recognitionRef.current.start();
          } else {
            const manual = prompt("HELIOS Voice Command (Speech API not available):", "Scan this website");
            if (manual) executeVoicePipeline(manual, false);
          }
        } catch (e) {
          // If already active, abort and restart fresh
          try {
            recognitionRef.current?.abort();
            setTimeout(() => {
              try { recognitionRef.current?.start(); } catch (err) {}
            }, 120);
          } catch (err) {}
        }
      };

      // Initialize SpeechRecognition ONCE with silence detection
      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          const rec = new SpeechRecognition();
          rec.continuous = true;
          rec.interimResults = true;
          rec.lang = 'en-US';

          rec.onstart = () => {
            setOrbState('LISTENING');
            transcriptRef.current = '';
          };

          rec.onresult = (event) => {
            let interim = '';
            let final = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
              if (event.results[i].isFinal) {
                final += event.results[i][0].transcript + ' ';
              } else {
                interim += event.results[i][0].transcript;
              }
            }
            const recognized = (final + interim).trim();
            if (recognized) {
              setTranscript(recognized);
              transcriptRef.current = recognized;

              // Smart silence timer: if user stops speaking for 1.5s, execute command!
              if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
              silenceTimerRef.current = setTimeout(() => {
                try {
                  recognitionRef.current?.stop();
                } catch (e) {}
              }, 1500);
            }
          };

          rec.onerror = (event) => {
            console.warn('Speech recognition error:', event.error);
            if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
            if (event.error === 'not-allowed') {
              setTranscript('Microphone access blocked. Click mic to grant permission or type below.');
            }
            setOrbState('IDLE');
          };

          rec.onend = () => {
            if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
            const command = transcriptRef.current.trim();
            if (command && !command.startsWith('HELIOS:') && !command.startsWith('Listening')) {
              playChime('ack');
              executeVoicePipeline(command, false);
            } else {
              setOrbState('IDLE');
            }
          };

          recognitionRef.current = rec;
        }

        // GREETING ON SITE OPEN
        const triggerGreetingOnOpen = () => {
          if (hasGreetedOnLoadRef.current) return;
          hasGreetedOnLoadRef.current = true;
          speakGreeting();
        };

        // Try direct audio play on mount
        triggerGreetingOnOpen();

        // Also bind to first document interaction to bypass strict browser autoplay policies
        const onFirstInteraction = () => {
          if (!hasGreetedOnLoadRef.current) {
            triggerGreetingOnOpen();
          }
          window.removeEventListener('click', onFirstInteraction);
          window.removeEventListener('pointerdown', onFirstInteraction);
          window.removeEventListener('keydown', onFirstInteraction);
        };

        window.addEventListener('click', onFirstInteraction);
        window.addEventListener('pointerdown', onFirstInteraction);
        window.addEventListener('keydown', onFirstInteraction);

        return () => {
          window.removeEventListener('click', onFirstInteraction);
          window.removeEventListener('pointerdown', onFirstInteraction);
          window.removeEventListener('keydown', onFirstInteraction);
        };
      }, []);

      // Execute command to real backend endpoint
      const executeVoicePipeline = async (commandText, isConfirmed) => {
        if (!commandText || !commandText.trim()) return;
        setOrbState('THINKING');
        try {
          const geminiKey = localStorage.getItem('helios_gemini_key') || '';
          const geminiModel = localStorage.getItem('helios_gemini_model') || 'gemini-3.5';
          const res = await fetch('/api/v1/voice/command', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              transcript: commandText,
              confirmed: isConfirmed,
              gemini_key: geminiKey,
              gemini_model: geminiModel,
              context: {
                active_tab: activeTab,
                target_url: currentUrl,
                theme: theme
              }
            })
          });

          const data = await res.json();

          if (data.status === 'CONFIRMATION_REQUIRED') {
            setOrbState('CONFIRMING');
            setPendingChallenge(data);
            playSpokenAudio(data.audio_url, data.speech);
            return;
          }

          if (data.status === 'SUCCESS' || data.status === 'SECURITY_BLOCK') {
            setLastSpeech(data.speech);

            // Execute UI Actions dynamically
            if (data.ui_action?.tab) {
              setActiveTab(data.ui_action.tab);
            }
            if (data.ui_action?.theme) {
              if (data.ui_action.theme !== theme) {
                toggleTheme();
              }
            }
            if (data.ui_action?.scan_result && onTriggerScan) {
              onTriggerScan(data.ui_action.scan_result);
            }
            if (data.ui_action?.retest_id && onTriggerRetest) {
              onTriggerRetest(data.ui_action.retest_id, data.ui_action.retest_status);
            }

            // Continuous hands-free dialogue: re-listen after replying unless user asked to stop
            playSpokenAudio(data.audio_url, data.speech, () => {
              if (handsFree && data.ui_action?.listening !== false) {
                setTimeout(() => {
                  startListening();
                }, 300);
              }
            });
          }
        } catch (err) {
          console.error(err);
          setOrbState('IDLE');
          playSpokenAudio(null, "Failed to connect to the HELIOS voice controller.");
        }
      };

      // Handle Mic / Orb Click
      const handleOrbClick = () => {
        setIsOpen(true);

        // Resume AudioContext on user gesture
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          ctx.resume();
        } catch (e) {}

        // If currently speaking, stop speech
        if (orbState === 'SPEAKING') {
          if (audioRef.current) audioRef.current.pause();
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          setOrbState('IDLE');
          return;
        }

        // If currently listening, stop listening
        if (orbState === 'LISTENING') {
          try {
            recognitionRef.current?.stop();
          } catch (e) {}
          setOrbState('IDLE');
          return;
        }

        // GREET IN VOICE: "Welcome sir, how may I help you?"
        // Then automatically start listening for the user's command!
        speakGreeting(() => {
          startListening();
        });
      };

      useEffect(() => {
        const handleCustomMic = () => {
          handleOrbClick();
        };
        window.addEventListener('helios-mic-click', handleCustomMic);
        return () => window.removeEventListener('helios-mic-click', handleCustomMic);
      }, [handleOrbClick]);

      const handleManualSubmit = (e) => {
        e.preventDefault();
        if (!manualText.trim()) return;
        const text = manualText.trim();
        setManualText('');
        setTranscript(text);
        executeVoicePipeline(text, false);
      };

      return (
        <div className="fixed bottom-6 right-6 z-50 flex flex-col items-end space-y-3 no-print">
          {/* Transcript & Command Status Popover */}
          {isOpen && (
            <div className="glass-strong rounded-2xl p-4 w-96 shadow-2xl border border-cyan-500/30 text-xs space-y-3">
              <div className="flex items-center justify-between border-b pb-2">
                <div className="flex items-center space-x-2">
                  <span className={`h-2.5 w-2.5 rounded-full ${
                    orbState === 'LISTENING' ? 'bg-emerald-500 animate-ping' :
                    orbState === 'THINKING' ? 'bg-amber-400 animate-spin' :
                    orbState === 'SPEAKING' ? 'bg-cyan-400 animate-pulse' :
                    orbState === 'CONFIRMING' ? 'bg-rose-500 animate-bounce' : 'bg-slate-400'
                  }`} />
                  <span className="font-mono font-bold uppercase tracking-wider text-[11px]">
                    Copilot: {orbState}
                  </span>
                  <span className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 font-bold">
                    Gemini 3.5
                  </span>
                  <button
                    onClick={() => setHandsFree(!handsFree)}
                    className={`text-[9px] font-mono px-1.5 py-0.5 rounded border font-bold transition ${
                      handsFree 
                        ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' 
                        : 'bg-slate-800 text-slate-400 border-slate-700'
                    }`}
                    title="Hands-free dialogue mode (Automatically listens after replying)"
                  >
                    Hands-Free: {handsFree ? 'ON' : 'OFF'}
                  </button>
                </div>
                <div className="flex items-center space-x-2">
                  <button
                    onClick={() => {
                      setVoiceMuted(!voiceMuted);
                      if (!voiceMuted && audioRef.current) audioRef.current.pause();
                    }}
                    className="text-slate-400 hover:text-white"
                    title={voiceMuted ? "Unmute Voice" : "Mute Voice"}
                  >
                    <Icon name={voiceMuted ? "volumeX" : "volume"} size={14} />
                  </button>
                  <button onClick={() => setIsOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" size={14} />
                  </button>
                </div>
              </div>

              {/* Dynamic Sound Wave Indicator */}
              {orbState === 'LISTENING' && (
                <div className="flex items-center justify-center space-x-1.5 py-1.5 bg-emerald-500/10 rounded-xl border border-emerald-500/30">
                  <div className="wave-bar"></div>
                  <div className="wave-bar"></div>
                  <div className="wave-bar"></div>
                  <div className="wave-bar"></div>
                  <div className="wave-bar"></div>
                  <span className="text-[10px] font-mono text-emerald-400 ml-2 font-bold animate-pulse">
                    Listening to you...
                  </span>
                </div>
              )}

              {/* Spoken User Transcript */}
              <div className="font-mono text-[11px] glass-inner p-2.5 rounded-xl min-h-[42px] flex items-center border border-white/5">
                {transcript || "Tap the mic orb and speak your security instruction..."}
              </div>

              {/* Spoken Response Preview */}
              {lastSpeech && (
                <div className="text-[11px] text-cyan-400 glass-inner p-2.5 rounded-xl border border-cyan-500/30 leading-relaxed flex items-start space-x-2">
                  <button
                    onClick={() => playSpokenAudio(null, lastSpeech)}
                    title="Replay Voice"
                    className="mt-0.5 text-cyan-400 hover:text-cyan-200 transition"
                  >
                    <Icon name="volume" size={13} />
                  </button>
                  <div>
                    <strong className="text-slate-300 font-bold">HELIOS: </strong>
                    <span>{lastSpeech}</span>
                  </div>
                </div>
              )}

              {/* Quick Input Box / Voice Push-to-Talk */}
              <form onSubmit={handleManualSubmit} className="flex items-center space-x-1.5 pt-1">
                <input
                  type="text"
                  value={manualText}
                  onChange={(e) => setManualText(e.target.value)}
                  placeholder="Or type command here..."
                  className="flex-1 bg-slate-900/60 border border-slate-700/60 rounded-xl px-2.5 py-1.5 text-[11px] font-mono text-slate-200 focus:outline-none focus:border-cyan-500"
                />
                <button
                  type="submit"
                  className="px-2.5 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl text-[10px] font-mono font-bold transition"
                >
                  Send
                </button>
                <button
                  type="button"
                  onClick={startListening}
                  className={`p-1.5 rounded-xl border transition ${
                    orbState === 'LISTENING' 
                      ? 'bg-emerald-500 text-white border-emerald-400 animate-pulse' 
                      : 'glass text-slate-300 hover:text-white border-cyan-500/30'
                  }`}
                  title="Speak Now"
                >
                  <Icon name="mic" size={13} />
                </button>
              </form>

              {/* Confirmation Challenge Gate */}
              {pendingChallenge && (
                <div className="p-3 rounded-xl bg-rose-500/10 border border-rose-500/40 space-y-2">
                  <div className="font-bold text-rose-400 text-[10px] uppercase font-mono flex items-center space-x-1">
                    <Icon name="alert" size={12} />
                    <span>Permission Challenge Required</span>
                  </div>
                  <p className="text-[11px] text-slate-300 leading-relaxed">{pendingChallenge.challenge_prompt}</p>
                  <div className="flex space-x-2 pt-1">
                    <button
                      onClick={() => {
                        const original = transcript;
                        setPendingChallenge(null);
                        executeVoicePipeline(original, true);
                      }}
                      className="flex-1 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg font-mono font-bold text-[10px] transition"
                    >
                      Authorize Execution
                    </button>
                    <button
                      onClick={() => {
                        setPendingChallenge(null);
                        setOrbState('IDLE');
                      }}
                      className="px-3 py-1.5 glass text-slate-300 rounded-lg text-[10px] font-mono"
                    >
                      Cancel
                    </button>
                  </div>
                </div>
              )}

              {/* Quick Command Chips */}
              <div className="pt-2 border-t border-white/5 space-y-1.5">
                <div className="text-[10px] font-mono text-slate-400 font-bold flex items-center justify-between">
                  <span>Quick Voice Prompts</span>
                  <span className="text-[9px] text-cyan-400">Click to run</span>
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {[
                    { label: "⚡ Scan this website", cmd: "Kindly run security scan on this website" },
                    { label: "🛡️ Show critical findings", cmd: "Show critical findings" },
                    { label: "🔄 Retest finding", cmd: "Retest finding HLS-WEB-001" },
                    { label: "🌓 Toggle theme", cmd: "Toggle theme" },
                    { label: "📑 CISO report", cmd: "Open CISO report" }
                  ].map((chip, idx) => (
                    <button
                      key={idx}
                      onClick={() => {
                        setTranscript(chip.cmd);
                        executeVoicePipeline(chip.cmd, false);
                      }}
                      className="text-[10px] font-mono px-2 py-1 rounded-lg glass hover:border-cyan-500/50 hover:text-cyan-400 text-slate-300 transition"
                    >
                      {chip.label}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Floating Reactive Voice Orb Button */}
          <button
            onClick={handleOrbClick}
            className={`h-14 w-14 rounded-full glass-strong flex items-center justify-center shadow-2xl transition-all transform hover:scale-105 ${
              orbState === 'LISTENING' ? 'border-emerald-500 shadow-emerald-500/50 glow-cyan scale-110' :
              orbState === 'THINKING' ? 'border-amber-400 shadow-amber-400/40' :
              orbState === 'SPEAKING' ? 'border-cyan-400 shadow-cyan-400/50 animate-pulse' :
              orbState === 'CONFIRMING' ? 'border-rose-500 shadow-rose-500/50 animate-bounce' :
              'border-cyan-500/40 hover:border-cyan-400'
            }`}
            title="Click to talk with HELIOS (Speaks greeting and listens)"
          >
            <div className="relative flex items-center justify-center">
              <Icon
                name={orbState === 'SPEAKING' ? "volume" : "mic"}
                size={22}
                className={
                  orbState === 'LISTENING' ? 'text-emerald-400' :
                  orbState === 'SPEAKING' ? 'text-cyan-400' :
                  orbState === 'CONFIRMING' ? 'text-rose-400' : 'text-slate-200'
                }
              />
              {orbState === 'LISTENING' && (
                <span className="absolute -top-1 -right-1 flex h-3 w-3">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
              )}
            </div>
          </button>
        </div>
      );
    }

    /* ─── MAIN APP COMPONENT ─── */
    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem('helios_theme') || 'dark');
      const [activeTab, setActiveTab] = useState('tracker');
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      // Live Website Scanner State
      const [targetUrl, setTargetUrl] = useState('https://see-it-report-it.lovable.app');
      const [isScanningUrl, setIsScanningUrl] = useState(false);
      const [urlScanResult, setUrlScanResult] = useState(null);
      const [retestingId, setRetestingId] = useState(null);
      const [retestOutcome, setRetestOutcome] = useState({});

      // Interactive Security Lab State
      const [labScenario, setLabScenario] = useState('sqli');
      const [labCode, setLabCode] = useState(LAB_SCENARIOS.sqli.vulnerable);
      const [isScanningCode, setIsScanningCode] = useState(false);
      const [codeScanResult, setCodeScanResult] = useState(null);

      // Handle Theme Toggle
      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
          root.classList.remove('light');
          document.body.className = 'dark';
        } else {
          root.classList.add('light');
          root.classList.remove('dark');
          document.body.className = 'light';
        }
        localStorage.setItem('helios_theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      };

      // Trigger Live URL Probe
      const handleScanUrl = async (e) => {
        if (e) e.preventDefault();
        if (!targetUrl.trim()) return;

        setIsScanningUrl(true);
        setUrlScanResult(null);

        try {

            headers: { 'Content-Type': 'application/json' },

              note: data.verification_note,
              time: data.timestamp

                    )}

                    {codeScanResult?.findings?.map((f, i) => (
                      <div key={i} className="glass-inner p-4 rounded-xl space-y-2 border border-rose-500/30">
                        <div className="flex items-center space-x-2">
                          <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-rose-500/20 text-rose-400 font-bold">
                            {f.severity}
                          </span>
                          <span className="font-bold text-xs">{f.title}</span>
                        </div>
                        <p className="text-xs text-slate-400">{f.technical_explanation}</p>
                        <div className="text-[11px] font-mono text-rose-400 bg-black/40 p-2 rounded">
                          {f.vulnerable_code}
                        </div>
                        <div className="text-[11px] font-mono text-emerald-400">
                          Fix: {f.remediation.recommended_fix}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: ATTACK PATHS */}
            {activeTab === 'architecture' && (
              <div className="space-y-6">
                <div className="glass-card rounded-2xl p-6">
                  <div className="flex items-center space-x-2 text-sm font-bold mb-1">
                    <Icon name="branch" size={18} className="text-cyan-500" />
                    <span>Attack-Path Engine & Exploit Graph</span>
                  </div>
                  <p className="text-xs text-slate-400">
                    Maps how unencrypted transport and absent security headers chain into session interception.
                  </p>

                  <div className="mt-6 space-y-6">
                    <div className="glass-inner rounded-xl p-5 space-y-4">
                      <div className="flex items-center justify-between border-b pb-3">
                        <div>
                          <span className="text-xs font-mono text-cyan-400 font-bold">AP-01: Network Insecurity ➔ Man-in-the-Middle</span>
                          <div className="text-xs text-slate-400">Triggered by missing HSTS</div>
                        </div>
                        <span className="text-xs font-mono px-2 py-0.5 rounded bg-rose-500/20 text-rose-400 font-bold">
                          Blast Radius: High
                        </span>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                        <div className="glass p-3 rounded-lg text-center">
                          <div className="text-[10px] font-mono text-slate-400">STEP 1</div>
                          <div className="font-bold text-xs mt-1">Unsecured Wi-Fi</div>
                          <div className="text-[10px] text-slate-500">Public Entry</div>
                        </div>
                        <div className="glass p-3 rounded-lg text-center border-amber-500/30">
                          <div className="text-[10px] font-mono text-slate-400">STEP 2</div>
                          <div className="font-bold text-xs mt-1">SSL Stripping</div>
                          <div className="text-[10px] text-amber-400 font-mono">Missing HSTS</div>
                        </div>
                        <div className="glass p-3 rounded-lg text-center border-rose-500/30">
                          <div className="text-[10px] font-mono text-slate-400">STEP 3</div>
                          <div className="font-bold text-xs mt-1">Session Intercept</div>
                          <div className="text-[10px] text-rose-400 font-mono">Plaintext HTTP</div>
                        </div>
                        <div className="glass p-3 rounded-lg text-center bg-rose-500/10 border-rose-500/50">
                          <div className="text-[10px] font-mono text-rose-400 font-bold">CROWN JEWEL</div>
                          <div className="font-bold text-xs mt-1">Account Takeover</div>
                          <div className="text-[10px] text-rose-400">Stolen Auth Token</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: CISO REPORT */}
            {activeTab === 'report' && (
              <div className="glass-card rounded-2xl p-8 space-y-6">
                <div className="flex items-center justify-between border-b pb-4">
                  <div>
                    <h2 className="text-xl font-bold">HELIOS CISO SECURITY AUDIT REPORT</h2>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Target: {urlScanResult?.target_url || 'Active Security Assessment'} • Date: {new Date().toLocaleDateString()}
                    </p>
                  </div>
                  <button
                    onClick={() => window.print()}
                    className="px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 text-white rounded-xl text-xs font-mono font-bold shadow no-print"
                  >
                    Print / Export PDF
                  </button>
                </div>

                <div className="space-y-4 text-sm leading-relaxed">
                  <p className="text-xs text-slate-400">
                    Overall posture risk score: <strong>{currentRiskScore}/100 ({currentRiskLevel})</strong> based on real HTTP response data.
                  </p>

                  <div className="glass-inner p-4 rounded-xl grid grid-cols-2 md:grid-cols-4 gap-4 text-center font-mono">
                    <div>
                      <div className="text-2xl font-bold text-rose-500">{activeFindingsCount}</div>
                      <div className="text-[10px] text-slate-400">Active Vulnerabilities</div>
                    </div>
                    <div>
                      <div className="text-2xl font-bold text-cyan-500">
                        {urlScanResult?.headers_inspected ? Object.keys(urlScanResult.headers_inspected).length : 0}
                      </div>
                      <div className="text-[10px] text-slate-400">Headers Audited</div>
                    </div>
                    <div>
                      <div className="text-2xl font-bold text-emerald-500">{resolvedFindingsCount}</div>
                      <div className="text-[10px] text-slate-400">Re-Tested & Resolved</div>
                    </div>
                    <div>
                      <div className="text-2xl font-bold text-indigo-500">100%</div>
                      <div className="text-[10px] text-slate-400">Real Evidence Verified</div>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* ─── REAL-TIME TWO-WAY VOICE COPILOT ORB ─── */}
          <VoiceCopilot
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            currentUrl={targetUrl}
            onTriggerScan={handleVoiceScanTrigger}
            onTriggerRetest={handleVoiceRetestTrigger}
            theme={theme}
            toggleTheme={toggleTheme}
          />

          {/* ─── SETTINGS MODAL ─── */}
          <SettingsModal
            isOpen={isSettingsOpen}
            onClose={() => setIsSettingsOpen(false)}
          />

          <footer className="glass px-6 py-3 border-t text-center text-xs font-mono text-slate-400 no-print flex items-center justify-between">
            <span>HELIOS Autonomous Security Engineer • Gemini Brain & ElevenLabs Voice</span>
            <span>Built with AI. Secured with HELIOS.</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
